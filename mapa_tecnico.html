<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio en Curso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <div id="infoBar" class="bg-teal-900 text-white p-2 text-xs flex justify-between px-4 z-[1000]">
        <span id="infoCliente">Cargando...</span>
        <span id="infoTecnico" class="font-bold"></span>
    </div>

    <div id="map" class="flex-grow w-full h-1/2 relative">
        <div class="absolute bottom-4 left-4 z-[1000] flex flex-col gap-2">
            <button onclick="abrirGoogleMaps()" class="bg-blue-600 text-white p-2 rounded-full shadow-lg font-bold">📍 GPS</button>
            <button onclick="exportarCoordenadas()" class="bg-green-600 text-white p-2 rounded-full shadow-lg font-bold">📤</button>
        </div>
        <button onclick="mostrarAyuda()" class="absolute top-16 right-4 z-[1000] bg-yellow-500 text-white p-3 rounded-full shadow-lg font-bold">❓</button>
    </div>

    <div class="h-1/2 bg-white p-4 shadow-lg flex flex-col">
        <h3 class="font-bold text-teal-900 mb-2">CHAT DEL SERVICIO</h3>
        <div id="chatBox" class="flex-grow overflow-y-auto border p-2 mb-2 bg-gray-50 rounded text-sm"></div>
        <div class="flex gap-2 mb-2">
            <button onclick="enviarRespuestaRapida('SÍ')" class="flex-1 bg-teal-100 p-1 rounded border border-teal-800 font-bold text-teal-900">SÍ</button>
            <button onclick="enviarRespuestaRapida('NO')" class="flex-1 bg-red-100 p-1 rounded border border-red-800 font-bold text-red-900">NO</button>
        </div>
        <div class="flex gap-2">
            <input type="text" id="inputMensaje" class="flex-grow p-2 border rounded" placeholder="Escribe un mensaje...">
            <button onclick="enviarMensaje()" class="bg-teal-800 text-white px-4 py-2 rounded font-bold">Enviar</button>
        </div>
        <button onclick="mostrarConfirmacion()" class="mt-4 w-full bg-red-600 text-white p-2 rounded font-bold">FINALIZAR SERVICIO</button>
    </div>

    <div id="customModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[2000] flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-80 text-center">
            <h3 class="font-bold text-lg mb-4" id="modalTitle">¿Finalizar Servicio?</h3>
            <div id="modalContent" class="mb-4 text-left text-sm"></div>
            <div class="flex gap-4" id="modalButtons">
                <button onclick="finalizarServicio()" class="flex-1 bg-red-600 text-white py-2 rounded">Sí</button>
                <button onclick="cerrarModal()" class="flex-1 bg-gray-300 py-2 rounded">No</button>
            </div>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);
    const urlParams = new URLSearchParams(window.location.search);
    const solicitudId = urlParams.get('id');
    const sonidoAlerta = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

    const map = L.map('map').setView([-17.7833, -63.1821], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    let usuarioHaInteractuado = false;
    map.on('mousedown touchstart zoom drag', () => usuarioHaInteractuado = true);

    let coordsCliente = null;
    let coordsMovil = null;
    let marcadorCliente = null;
    let marcadorMovil = null;

    function ajustarVista() {
        if (!usuarioHaInteractuado && coordsCliente && coordsMovil) {
            map.fitBounds(L.latLngBounds([coordsCliente, coordsMovil]), { padding: [50, 50] });
        }
    }

    async function cargarInfo() {
        const { data } = await client.from('solicitudes').select('*').eq('solicitud_id', solicitudId).single();
        if (data) {
            document.getElementById('infoCliente').innerText = `${data.nombre_usuario || 'Cliente'}: ${data.comentario_solicitud || ''}`;
            document.getElementById('infoTecnico').innerText = `ID: ${localStorage.getItem('tecnico')}`;
            coordsCliente = [data.latitud, data.longitud];
            marcadorCliente = L.marker(coordsCliente, { icon: L.divIcon({ html: '🏠', className: 'text-2xl' }) }).addTo(map);
            cargarMensajesPrevios();
            ajustarVista();
        }
    }
    cargarInfo();

    async function cargarMensajesPrevios() {
        const { data } = await client.from('mensajes').select('*').eq('solicitud_id', solicitudId).order('created_at', { ascending: true });
        if (data) data.forEach(msg => renderizarMensaje(msg));
    }

    function abrirGoogleMaps() {
        if(coordsCliente) window.open(`https://www.google.com/maps/dir/?api=1&destination=${coordsCliente[0]},${coordsCliente[1]}`, '_blank');
    }

    function exportarCoordenadas() {
        if(coordsCliente) {
            const txt = `${coordsCliente[0]},${coordsCliente[1]}`;
            navigator.clipboard.writeText(txt);
            alert("Coordenadas copiadas: " + txt);
        }
    }

    function mostrarAyuda() {
        document.getElementById('modalTitle').innerText = "Guía de Ayuda";
        document.getElementById('modalContent').innerHTML = "<ol class='list-decimal ml-4'><li>Confirma el servicio.</li><li>Saluda al cliente.</li><li>Usa el GPS para llegar.</li><li>Finaliza al concluir.</li></ol>";
        document.getElementById('modalButtons').innerHTML = '<button onclick="cerrarModal()" class="w-full bg-teal-800 text-white py-2 rounded">Entendido</button>';
        document.getElementById('customModal').classList.remove('hidden');
    }

    function iniciarTracking() {
        navigator.geolocation.watchPosition((pos) => {
            coordsMovil = [pos.coords.latitude, pos.coords.longitude];
            if (!marcadorMovil) {
                marcadorMovil = L.marker(coordsMovil, { icon: L.divIcon({ html: '🚐', className: 'text-2xl' }) }).addTo(map);
            } else {
                marcadorMovil.setLatLng(coordsMovil);
            }
            ajustarVista();
        }, null, { enableHighAccuracy: true });
    }
    iniciarTracking();

    client.channel('mensajes_channel')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensajes', filter: `solicitud_id=eq.${solicitudId}` }, (payload) => {
          sonidoAlerta.play().catch(e => console.log("Sonido bloqueado"));
          renderizarMensaje(payload.new);
      }).subscribe();

    function renderizarMensaje(msg) {
        const chatBox = document.getElementById('chatBox');
        const esTecnico = msg.emisor === 'tecnico';
        chatBox.innerHTML += `<div class="mb-2 ${esTecnico ? 'text-right' : 'text-left'}"><span class="inline-block p-2 rounded ${esTecnico ? 'bg-teal-100' : 'bg-gray-200'} text-sm">${msg.mensaje}</span></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function enviarMensaje() {
        const input = document.getElementById('inputMensaje');
        if (!input.value.trim()) return;
        await client.from('mensajes').insert({ solicitud_id: solicitudId, emisor: 'tecnico', mensaje: input.value });
        input.value = "";
    }
    
    async function enviarRespuestaRapida(val) {
        await client.from('mensajes').insert({ solicitud_id: solicitudId, emisor: 'tecnico', mensaje: val });
    }

    function mostrarConfirmacion() { 
        document.getElementById('modalTitle').innerText = "¿Finalizar Servicio?";
        document.getElementById('modalContent').innerHTML = "Se cerrará el servicio y se borrarán los datos temporales.";
        document.getElementById('modalButtons').innerHTML = '<button onclick="finalizarServicio()" class="flex-1 bg-red-600 text-white py-2 rounded">Sí</button><button onclick="cerrarModal()" class="flex-1 bg-gray-300 py-2 rounded">No</button>';
        document.getElementById('customModal').classList.remove('hidden'); 
    }
    function cerrarModal() { document.getElementById('customModal').classList.add('hidden'); }
    async function finalizarServicio() {
        localStorage.removeItem('solicitudId_activo');
        await client.from('mensajes').delete().eq('solicitud_id', solicitudId);
        await client.from('ubicacion_moviles').delete().eq('solicitud_id', solicitudId);
        await client.from('solicitudes').update({ respuesta_solicitud: 'finalizado' }).eq('solicitud_id', solicitudId);
        window.location.href = "tecnico.html";
    }
    </script>
</body>
</html>
