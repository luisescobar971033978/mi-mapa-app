<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicio en Curso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <div id="map" class="flex-grow w-full h-1/2"></div>

    <div class="h-1/2 bg-white p-4 shadow-lg flex flex-col">
        <h3 class="font-bold text-teal-900 mb-2">CHAT DEL SERVICIO</h3>
        <div id="chatBox" class="flex-grow overflow-y-auto border p-2 mb-2 bg-gray-50 rounded"></div>
        <div class="flex gap-2">
            <input type="text" id="inputMensaje" class="flex-grow p-2 border rounded" placeholder="Escribe un mensaje...">
            <button onclick="enviarMensaje()" class="bg-teal-800 text-white px-4 py-2 rounded font-bold">Enviar</button>
        </div>
        <button onclick="finalizarServicio()" class="mt-4 w-full bg-red-600 text-white p-2 rounded font-bold">FINALIZAR SERVICIO</button>
    </div>

    <script>
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    const urlParams = new URLSearchParams(window.location.search);
    const solicitudId = urlParams.get('id');

    // Inicialización del Mapa
    const map = L.map('map').setView([-17.7833, -63.1821], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

    // MEJORA: Navegación Autónoma
    let usuarioHaInteractuado = false;
    map.on('mousedown', () => usuarioHaInteractuado = true);
    map.on('touchstart', () => usuarioHaInteractuado = true);

    let marcadorMovil = null;
    let marcadorCliente = null;
    let coordsCliente = null;
    let coordsMovil = null;

    function centrarMapa() {
        // Solo centra si el usuario NO ha tomado el control manual del mapa
        if (!usuarioHaInteractuado) {
            if (coordsCliente && coordsMovil) {
                map.fitBounds(L.latLngBounds([coordsCliente, coordsMovil]), { padding: [50, 50] });
            } else if (coordsCliente) {
                map.setView(coordsCliente, 15);
            }
        }
    }

    async function cargarUbicacionCliente() {
        const { data } = await client.from('solicitudes').select('latitud, longitud').eq('solicitud_id', solicitudId).single();
        if (data) {
            coordsCliente = [data.latitud, data.longitud];
            marcadorCliente = L.marker(coordsCliente, { icon: L.divIcon({ html: '🏠', className: 'text-2xl' }) }).addTo(map).bindPopup("Ubicación del Servicio");
            centrarMapa();
        }
    }
    cargarUbicacionCliente();

    // Tracking con watchPosition
    function iniciarTracking() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                coordsMovil = [lat, lng];
                const movilId = localStorage.getItem('movil');

                if (marcadorMovil) {
                    marcadorMovil.setLatLng(coordsMovil);
                } else {
                    marcadorMovil = L.marker(coordsMovil, { icon: L.divIcon({ html: '🚐', className: 'text-2xl' }) }).addTo(map).bindPopup("Mi ubicación");
                }
                
                centrarMapa();

                await client.from('ubicacion_moviles').upsert({
                    movil_id: movilId,
                    latitud: lat,
                    longitud: lng,
                    solicitud_id: solicitudId,
                    ultima_actualizacion: new Date().toISOString()
                });
            }, (err) => console.error("Error GPS:", err), { enableHighAccuracy: true });
        }
    }
    iniciarTracking();

    async function finalizarServicio() {
        if(!confirm("¿Seguro que deseas finalizar el servicio?")) return;
        
        const movilId = localStorage.getItem('movil');
        
        try {
            // Borramos solo los datos asociados a este servicio y a este móvil específico
            await client.from('mensajes').delete().eq('solicitud_id', solicitudId);
            await client.from('ubicacion_moviles').delete().eq('solicitud_id', solicitudId).eq('movil_id', movilId);
            await client.from('solicitudes').update({ respuesta_solicitud: 'finalizado' }).eq('solicitud_id', solicitudId);
            
            window.location.href = "tecnico.html";
        } catch (e) {
            console.error("Error al finalizar:", e);
            alert("Ocurrió un error al finalizar. Revisa la consola.");
        }
    }
    </script>
</body>
</html>
