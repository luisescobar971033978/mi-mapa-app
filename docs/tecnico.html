<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .girando { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <div id="loginForm" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h3 class="font-bold text-teal-900 mb-4">IDENTIFICACIÓN DE TÉCNICO</h3>
            <input type="text" id="id_tecnico" placeholder="ID Técnico" class="w-full p-2 border rounded mb-2">
            <select id="select_movil" class="w-full p-2 border rounded mb-4">
                <option value="">Seleccione su Móvil</option>
                <option value="Movil_1">Móvil 1</option><option value="Movil_2">Móvil 2</option>
                <option value="Movil_3">Móvil 3</option><option value="Movil_4">Móvil 4</option>
                <option value="Movil_5">Móvil 5</option>
            </select>
            <button id="btnIniciar" onclick="guardarSesion()" class="w-full bg-teal-900 text-white p-2 rounded font-bold">INICIAR TURNO</button>
            <div id="loginMessage" class="mt-4 p-3 rounded-lg border border-red-400 bg-red-100 text-red-800 text-sm font-bold hidden text-center"></div>
        </div>

        <header class="mb-6 text-center hidden" id="headerPrincipal">
            <h2 class="text-2xl font-bold text-teal-900">SOLICITUDES PENDIENTES</h2>
            <button onclick="actualizarManual()" class="mt-2 text-teal-800 hover:text-teal-600">
                <span id="btnIcon" style="font-size: 24px; display: inline-block;">⟳</span>
            </button>
            <div class="flex justify-center items-center gap-2 mt-2">
                <p class="text-gray-500 text-sm">Técnico: <span id="displayTecnico" class="font-bold"></span></p>
            </div>
            <button onclick="cerrarSesion()" class="mt-3 text-xs text-red-600 underline hover:text-red-800">Cerrar Sesión</button>
        </header>

        <div id="listaSolicitudes" class="space-y-4 hidden">
            <div class="text-center py-10">Cargando datos...</div>
        </div>
    </div>
<div id="modalCustom" class="hidden fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-[3000]">
    <div class="bg-white p-6 rounded shadow-lg max-w-sm w-full">
        <h2 id="modalTitle" class="text-xl font-bold mb-4"></h2>
        <p id="modalText" class="mb-4"></p>
        <div class="flex gap-2">
            <button id="btnCancelar" class="flex-1 bg-gray-300 text-gray-800 px-4 py-2 rounded font-bold">NO</button>
            <button id="btnConfirmar" class="flex-1 bg-teal-800 text-white px-4 py-2 rounded font-bold">SÍ</button>
        </div>
    </div>
</div>
   <script>
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);
      
    async function actualizarManual() {
        const btnIcon = document.getElementById('btnIcon');
        btnIcon.classList.add('girando');
        await cargarSolicitudes();
        setTimeout(() => btnIcon.classList.remove('girando'), 500);
    }

    function mostrarModal(titulo, texto, onConfirm) {
        const modal = document.getElementById('modalCustom');
        if (!modal) return;
        document.getElementById('modalTitle').innerText = titulo;
        document.getElementById('modalText').innerText = texto;
        
        document.getElementById('btnConfirmar').onclick = () => { 
            modal.classList.add('hidden'); 
            if(onConfirm) onConfirm(); 
        };
        
        document.getElementById('btnCancelar').onclick = () => { 
            modal.classList.add('hidden'); 
        };
        
        modal.classList.remove('hidden');
    }

    window.onload = () => {
        const t = localStorage.getItem('tecnico');
        const loginForm = document.getElementById('loginForm');
        const header = document.getElementById('headerPrincipal');
        const lista = document.getElementById('listaSolicitudes');

        if (!t) {
            loginForm.classList.remove('hidden');
            header.classList.add('hidden');
            lista.classList.add('hidden');
        } else {
            loginForm.classList.add('hidden'); 
            document.getElementById('displayTecnico').innerText = t;
            header.classList.remove('hidden');
            
            const servicioPendiente = localStorage.getItem('solicitudId_activo');
            if (servicioPendiente) {
                window.location.href = `mapa_tecnico.html?id=${servicioPendiente}`;
            } else {
                cargarSolicitudes();
                setInterval(cargarSolicitudes, 30000);
            }
        }
    };

    function cerrarSesion() {
        mostrarModal("Cerrar Sesión", "¿Deseas cerrar sesión?", () => {
            localStorage.clear();
            location.reload();
        });
    }

    async function guardarSesion() {
        const idTecnico = document.getElementById('id_tecnico').value.trim();
        const movil = document.getElementById('select_movil').value;
        const msgDiv = document.getElementById('loginMessage');

        if (!idTecnico || !movil) {
            msgDiv.innerText = "⚠️ Complete todos los campos.";
            msgDiv.classList.remove('hidden');
            return;
        }

        try {
            const { data, error } = await client.from('moviles').select('*').eq('id_tecnico', idTecnico).eq('estado', 'activo').single();
            if (error || !data) {
                msgDiv.innerText = "❌ Acceso denegado.";
                msgDiv.classList.remove('hidden');
                return;
            }
            localStorage.setItem('tecnico', idTecnico);
            localStorage.setItem('movil', movil);
            location.reload();
        } catch (err) {
            console.error(err);
            alert("Error de conexión.");
        }
    }

    async function cargarSolicitudes() {
        const lista = document.getElementById('listaSolicitudes');
        
        const { data, error } = await client
            .from('solicitudes')
            .select('*')
            .eq('respuesta_solicitud', 'pendiente')
            .order('solicitud_id', { ascending: false });
        
        if (error) { 
            console.error("Error Supabase:", error);
            lista.innerHTML = `<p class="text-red-500 text-center">Error: ${error.message}</p>`; 
            lista.classList.remove('hidden');
            return; 
        }
        
        if (data.length === 0) { 
            lista.innerHTML = `<p class="text-gray-500 text-center">No hay pendientes.</p>`; 
            lista.classList.remove('hidden');
            return; 
        }
        
        const ahora = new Date();
        const offsetBolivia = -4 * 60 * 60 * 1000;
        const fechaBolivia = new Date(ahora.getTime() + offsetBolivia);
        const fechaActualStr = fechaBolivia.toISOString().split('T')[0];
        const minutosActualesTotales = fechaBolivia.getHours() * 60 + fechaBolivia.getMinutes();

        lista.innerHTML = "";
        data.forEach(s => {
            const fecha = s.fecha_solicitud || 'N/A';
            const hora = s.hora_solicitud ? s.hora_solicitud.substring(0, 5) : 'N/A';

            // Estilo por defecto (blanco con borde gris)
            let estiloCard = "background-color: #ffffff; border-color: #cbd5e1;";

            if (fecha === fechaActualStr && s.hora_solicitud) {
                const [hSol, mSol] = hora.split(':').map(Number);
                const minutosSolicitudTotales = hSol * 60 + mSol;
                const diferenciaMinutos = minutosSolicitudTotales - minutosActualesTotales;

                // 1. Rojo claro: 30 minutos o menos (o pasado/en curso)
                if (diferenciaMinutos <= 30 && diferenciaMinutos >= -120) {
                    estiloCard = "background-color: #fee2e2; border-color: #f87171;";
                } 
                // 2. Naranja: Entre 31 y 45 minutos
                else if (diferenciaMinutos > 30 && diferenciaMinutos <= 45) {
                    estiloCard = "background-color: #ffedd5; border-color: #fb923c;";
                } 
                // 3. Amarillo: Entre 46 y 60 minutos
                else if (diferenciaMinutos > 45 && diferenciaMinutos <= 60) {
                    estiloCard = "background-color: #fef9c3; border-color: #facc15;";
                }
            }

            lista.innerHTML += `
            <div style="${estiloCard}" class="p-4 rounded-lg shadow-md border-l-4 mb-4 transition-colors">
                <h3 class="font-bold text-lg">${s.comentario_solicitud || 'Sin comentario'}</h3>
                <p class="text-sm text-gray-600 mb-3"><strong>Cliente:</strong> ${s.nombre_usuario || 'Anónimo'}</p>
                <div class="flex items-center justify-between text-xs text-gray-500 mb-4 px-1">
                    <span class="flex items-center gap-1">📅 ${fecha}</span>
                    <span class="flex items-center gap-1">🕒 ${hora}</span>
                    <span class="flex items-center gap-1 font-bold text-teal-800">🆔 ${s.solicitud_id}</span>
                </div>
                <button onclick="confirmar(${s.solicitud_id})" class="w-full bg-teal-800 text-white p-2 rounded font-bold">
                    CONFIRMAR SERVICIO
                </button>
            </div>`;
        });
        lista.classList.remove('hidden');
    }
        
    async function confirmar(id) {
        localStorage.setItem('solicitudId_activo', id);
        const ahora = new Date().toTimeString().split(' ')[0];
        try {
            const { error } = await client.from('solicitudes').update({ 
                respuesta_solicitud: 'aceptado',
                id_tecnico: localStorage.getItem('tecnico'),
                movil_id: localStorage.getItem('movil'),
                hora_contacto: ahora 
            }).eq('solicitud_id', id);

            if (error) throw error;

            await client.from('mensajes').insert({
                solicitud_id: id,
                emisor: 'tecnico',
                mensaje: 'Hola, soy su técnico. Voy en camino, Por favor confirmas la ubicacion del Servicio, Gracias....!'
            });

            window.location.href = `mapa_tecnico.html?id=${id}`;
        } catch (err) {
            alert("Error al confirmar el servicio.");
        }
    }

    client.channel('solicitudes_channel')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'solicitudes' }, () => { 
            cargarSolicitudes(); 
        })
        .subscribe();
</script>
</body>
</html>
