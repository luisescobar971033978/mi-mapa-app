<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación y Ampliación de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

    <div class="bg-white w-full max-w-2xl rounded-lg shadow-xl p-6 space-y-6">
        <div class="border-b pb-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-900">🛠️ Asignación y Ampliación de Servicio</h1>
            <span id="labelSolicitudId" class="text-sm bg-teal-100 text-teal-800 font-semibold px-3 py-1 rounded-full">ID: --</span>
        </div>

        <!-- Formularios de selección independientes para Técnico y Móvil -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Técnico Asignado (id_tecnico):</label>
                <select id="selectTecnico" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    <option value="">Cargando técnicos...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Móvil de Traslado (movil_id):</label>
                <select id="selectMovil" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    <option value="">Cargando móviles...</option>
                </select>
            </div>
        </div>

        <!-- Estado del flujo -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Estado del Flujo (respuesta_solicitud):</label>
            <select id="selectEstado" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                <option value="pendiente">Pendiente</option>
                <option value="iniciado">Iniciado</option>
                <option value="aceptado">Aceptado</option>
                <option value="finalizado">Finalizado</option>
            </select>
        </div>

        <!-- Sección de Selección Múltiple de Horarios -->
        <div class="border-t pt-4">
            <h2 class="text-md font-bold text-teal-900 mb-1">📅 SELECCIÓN MÚLTIPLE DE HORARIOS (AMPLIACIÓN):</h2>
            <p class="text-xs text-gray-500 mb-3">Haga clic en los bloques consecutivos que desea asignar o ampliar:</p>
            
            <div class="bg-gray-50 border rounded-lg overflow-hidden max-h-72 overflow-y-auto">
                <table class="w-full border-collapse text-center text-sm">
                    <thead>
                        <tr class="bg-teal-100 text-teal-900 font-bold text-xs">
                            <th class="p-2 border-b border-r">Hora</th>
                            <th id="thCol1" class="p-2 border-b border-r">DÍA 1</th>
                            <th id="thCol2" class="p-2 border-b">DÍA 2</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaAgenda">
                        <!-- Generado dinámicamente -->
                    </tbody>
                </table>
            </div>

            <div class="mt-2 text-xs font-semibold text-gray-700">
                Horarios Seleccionados: <span id="infoTiempoActual" class="text-teal-700 font-bold">Ninguno</span>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex justify-end gap-3 pt-4 border-t">
            <button onclick="window.close()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium transition">Cancelar</button>
            <button onclick="guardarAsignacion()" class="px-6 py-2 bg-teal-800 text-white rounded-lg hover:bg-teal-900 font-medium shadow transition">Guardar Cambios</button>
        </div>
    </div>

    <script>
        const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');
        
        const urlParams = new URLSearchParams(window.location.search);
        const solicitudId = urlParams.get('id');

        // CLASE ORIENTADA A OBJETOS PARA LA GESTIÓN DE LA AGENDA Y SELECCIÓN MÚLTIPLE
        class GestorAgendaServicio {
            constructor() {
                this.horasDisponibles = [
                    "08:00:00", "09:00:00", "10:00:00", "11:00:00", "12:00:00", 
                    "13:00:00", "14:00:00", "15:00:00", "16:00:00", "17:00:00", 
                    "18:00:00", "19:00:00", "20:00:00", "21:00:00", "22:00:00", 
                    "23:00:00", "24:00:00"
                ];
                this.seleccionados = []; // Almacena objetos {fecha, hora}
            }

            inicializarSeleccion(fecha, hora) {
                // Evitar duplicados al cargar por defecto
                const existe = this.seleccionados.some(s => s.fecha === fecha && s.hora === hora);
                if (!existe) {
                    this.seleccionados.push({ fecha, hora });
                }
            }

            toggleSeleccion(fecha, hora, fechaMinima, horaMinima) {
                if (fecha < fechaMinima || (fecha === fechaMinima && hora < horaMinima)) {
                    alert("No puede seleccionar un horario anterior al de la solicitud original.");
                    return;
                }

                const index = this.seleccionados.findIndex(s => s.fecha === fecha && s.hora === hora);
                if (index > -1) {
                    // Si ya está seleccionado, permitir desmarcar solo si hay más de 1 elemento
                    if (this.seleccionados.length > 1) {
                        this.seleccionados.splice(index, 1);
                    } else {
                        alert("Debe mantener al menos un horario seleccionado.");
                        return;
                    }
                } else {
                    this.seleccionados.push({ fecha, hora });
                }
                // Ordenar cronológicamente
                this.seleccionados.sort((a, b) => `${a.fecha} ${a.hora}`.localeCompare(`${b.fecha} ${b.hora}`));
                this.actualizarVista(fechaMinima, horaMinima);
            }

            renderizarTabla(tbodyId, fechaMinima, horaMinima, fechasCols) {
                const tbody = document.getElementById(tbodyId);
                let html = '';

                this.horasDisponibles.forEach(hora => {
                    const horaCorta = hora === "24:00:00" ? "24:00" : hora.substring(0, 5);
                    let filaHTML = `<tr class="border-b hover:bg-gray-100">`;
                    filaHTML += `<td class="p-2 border-r font-bold text-gray-700 bg-gray-50 text-xs">${horaCorta}</td>`;

                    fechasCols.forEach(fechaCol => {
                        const esAnterior = (fechaCol < fechaMinima) || (fechaCol === fechaMinima && hora < horaMinima);

                        if (esAnterior) {
                            filaHTML += `<td class="p-2 text-gray-300 bg-gray-50 border-r select-none">-</td>`;
                        } else {
                            const estaSeleccionado = this.seleccionados.some(s => s.fecha === fechaCol && s.hora === hora);

                            if (estaSeleccionado) {
                                filaHTML += `<td onclick="gestorAgenda.toggleSeleccion('${fechaCol}', '${hora}', '${fechaMinima}', '${horaMinima}')" class="p-2 bg-teal-700 text-white font-bold cursor-pointer select-none border-r ring-2 ring-teal-400">Seleccionado</td>`;
                            } else {
                                filaHTML += `<td onclick="gestorAgenda.toggleSeleccion('${fechaCol}', '${hora}', '${fechaMinima}', '${horaMinima}')" class="p-2 text-teal-800 bg-white hover:bg-teal-50 cursor-pointer select-none border-r font-medium">Libre</td>`;
                            }
                        }
                    });

                    filaHTML += `</tr>`;
                    html += filaHTML;
                });
                tbody.innerHTML = html;
                this.actualizarResumenTexto();
            }

            actualizarVista(fechaMinima, horaMinima) {
                const fechasCols = window.fechasColumnasGlobal || [];
                this.renderizarTabla('cuerpoTablaAgenda', fechaMinima, horaMinima, fechasCols);
            }

            actualizarResumenTexto() {
                const spanInfo = document.getElementById('infoTiempoActual');
                if (this.seleccionados.length === 0) {
                    spanInfo.innerText = "Ninguno";
                    return;
                }
                const textos = this.seleccionados.map(s => `${s.fecha} (${s.hora.substring(0,5)})`);
                spanInfo.innerText = textos.join(" | ");
            }

            obtenerSeleccionados() {
                return this.seleccionados;
            }
        }

        const gestorAgenda = new GestorAgendaServicio();
        let fechaMinimaPermitida = "";
        let horaMinimaPermitida = "";

        async function inicializarModulo() {
            if (!solicitudId) {
                alert("No se especificó un ID de solicitud.");
                window.close();
                return;
            }
            document.getElementById('labelSolicitudId').innerText = `ID: ${solicitudId}`;

            // 1. Cargar técnicos y móviles
            const { data: moviles } = await client.from('moviles').select('movil_id, id_tecnico, celular, estado').eq('estado', 'activo');
            
            const selectTecnico = document.getElementById('selectTecnico');
            selectTecnico.innerHTML = '<option value="">-- Sin técnico asignado --</option>';

            const selectMovil = document.getElementById('selectMovil');
            selectMovil.innerHTML = '<option value="">-- Sin móvil asignado --</option>';

            if (moviles) {
                moviles.forEach(m => {
                    if (m.id_tecnico) selectTecnico.innerHTML += `<option value="${m.id_tecnico}">Técnico ID: ${m.id_tecnico}</option>`;
                    if (m.movil_id) selectMovil.innerHTML += `<option value="${m.movil_id}">${m.movil_id} (Cel: ${m.celular})</option>`;
                });
            }

            // 2. Cargar datos de la solicitud actual
            const { data: sol, error } = await client.from('solicitudes').select('*').eq('solicitud_id', solicitudId).single();
            if (error || !sol) {
                alert("No se pudo cargar la información de la solicitud.");
                return;
            }

            if (sol.id_tecnico) selectTecnico.value = sol.id_tecnico;
            if (sol.movil_id) selectMovil.value = sol.movil_id;
            if (sol.respuesta_solicitud) document.getElementById('selectEstado').value = sol.respuesta_solicitud.toLowerCase();

            const fechaSolOriginal = sol.fecha_solicitud || "2026-08-21";
            const horaSolOriginal = sol.hora_solicitud || "20:00:00";

            fechaMinimaPermitida = fechaSolOriginal;
            horaMinimaPermitida = horaSolOriginal;

            // Generar columnas de fecha (Día de la solicitud y el día posterior)
            const partesFecha = fechaSolOriginal.split('-');
            const d1 = new Date(partesFecha[0], partesFecha[1] - 1, partesFecha[2]);
            const d2 = new Date(d1);
            d2.setDate(d2.getDate() + 1);

            const f1Str = fechaSolOriginal;
            const f2Str = `${d2.getFullYear()}-${String(d2.getMonth() + 1).padStart(2, '0')}-${String(d2.getDate()).padStart(2, '0')}`;
            window.fechasColumnasGlobal = [f1Str, f2Str];

            // Textos descriptivos de los días de la semana
            const diasSemana = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
            document.getElementById('thCol1').innerHTML = `${diasSemana[d1.getDay()]}<br><span class="font-normal">${d1.getDate()}/${d1.getMonth() + 1}</span>`;
            document.getElementById('thCol2').innerHTML = `${diasSemana[d2.getDay()]}<br><span class="font-normal">${d2.getDate()}/${d2.getMonth() + 1}</span>`;

            // Inicializar con la fecha y hora original de la solicitud
            gestorAgenda.inicializarSeleccion(fechaSolOriginal, horaSolOriginal);
            gestorAgenda.renderizarTabla('cuerpoTablaAgenda', fechaMinimaPermitida, horaMinimaPermitida, window.fechasColumnasGlobal);
        }

        async function guardarAsignacion() {
            const nuevoTecnico = document.getElementById('selectTecnico').value || null;
            const nuevoMovil = document.getElementById('selectMovil').value || null;
            const nuevoEstado = document.getElementById('selectEstado').value;
            
            const horariosSeleccionados = gestorAgenda.obtenerSeleccionados();
            if (horariosSeleccionados.length === 0) {
                alert("Debe seleccionar al menos un horario.");
                return;
            }

            // 1. Actualizar el registro principal con el primer horario seleccionado
            const primerHorario = horariosSeleccionados[0];
            const datosActualizacionPrincipal = {
                id_tecnico: nuevoTecnico,
                movil_id: nuevoMovil,
                respuesta_solicitud: nuevoEstado,
                fecha_solicitud: primerHorario.fecha,
                hora_solicitud: primerHorario.hora
            };

            const { error: errorUpdate } = await client.from('solicitudes')
                .update(datosActualizacionPrincipal)
                .eq('solicitud_id', solicitudId);

            if (errorUpdate) {
                alert("Error al actualizar la solicitud principal: " + errorUpdate.message);
                return;
            }

            // 2. Si hay más horarios seleccionados (ampliación consecutiva), duplicar registros con el mismo solicitud_id
            if (horariosSeleccionados.length > 1) {
                // Obtenemos la estructura completa del registro original para clonarlo correctamente
                const { data: solOriginal } = await client.from('solicitudes').select('*').eq('solicitud_id', solicitudId).single();

                if (solOriginal) {
                    for (let i = 1; i < horariosSeleccionados.length; i++) {
                        const hSel = horariosSeleccionados[i];
                        
                        // Creamos el clon omitiendo el ID autoincremental original para que Supabase genere/duplique manteniendo el vínculo
                        const clonSolicitud = { ...solOriginal };
                        delete clonSolicitud.id; // Por si usa id autoincremental interno
                        // Nota: dejamos el mismo 'solicitud_id' (o si es la PK principal, ajustamos según esquema; aquí duplicamos la fila conservando el valor de la solicitud o clonando)
                        clonSolicitud.id_tecnico = nuevoTecnico;
                        clonSolicitud.movil_id = nuevoMovil;
                        clonSolicitud.respuesta_solicitud = nuevoEstado;
                        clonSolicitud.fecha_solicitud = hSel.fecha;
                        clonSolicitud.hora_solicitud = hSel.hora;

                        // Insertar la duplicación en la tabla solicitudes
                        const { error: errorInsert } = await client.from('solicitudes').insert([clonSolicitud]);
                        if (errorInsert) {
                            console.error("Error al duplicar la hora adicional:", errorInsert.message);
                        }
                    }
                }
            }

            alert("¡Asignación guardada y horarios ampliados/duplicados con éxito!");
            if (window.opener && !window.opener.closed) {
                window.opener.refrescarPanel();
            }
            window.close();
        }

        document.addEventListener('DOMContentLoaded', inicializarModulo);
    </script>
</body>
</html>
