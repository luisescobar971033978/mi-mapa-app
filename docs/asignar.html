<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignación y Ampliación de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex items-center justify-center">

    <div class="bg-white w-full max-w-2xl rounded-lg shadow-xl p-6 space-y-6">
        <div class="border-b pb-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-teal-900">🛠️ Asignación y Gestión de Solicitud</h1>
            <span id="labelSolicitudId" class="text-sm bg-teal-100 text-teal-800 font-semibold px-3 py-1 rounded-full">ID: --</span>
        </div>

        <!-- Formularios de selección independientes para Técnico y Móvil -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Técnico Asignado (id_tecnico):</label>
                <select id="selectTecnico" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    <option value="">Cargando técnicos...</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Móvil de Traslado (movil_id):</label>
                <select id="selectMovil" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                    <option value="">Cargando móviles...</option>
                </select>
            </div>
        </div>

        <!-- Estado del flujo -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Estado del Flujo (respuesta_solicitud):</label>
            <select id="selectEstado" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
                <option value="pendiente">Pendiente</option>
                <option value="iniciado">Iniciado</option>
                <option value="aceptado">Aceptado</option>
                <option value="finalizado">Finalizado</option>
            </select>
        </div>

        <!-- Sección de Selección de Fecha y Hora (Tabla Estilo Matriz) -->
        <div class="border-t pt-4">
            <h2 class="text-md font-bold text-teal-900 mb-1">📅 SELECCIONE FECHA Y HORA:</h2>
            <p class="text-xs text-gray-500 mb-3">Los horarios anteriores a la solicitud actual están inhabilitados (X). Seleccione un espacio disponible:</p>
            
            <div class="bg-gray-50 border rounded-lg overflow-hidden max-h-72 overflow-y-auto">
                <table class="w-full border-collapse text-center text-sm">
                    <thead>
                        <tr class="bg-teal-100 text-teal-900 font-bold text-xs">
                            <th class="p-2 border-b border-r">Hora</th>
                            <th class="p-2 border-b border-r">VIERNES<br><span class="font-normal">21/8</span></th>
                            <th class="p-2 border-b">SÁBADO<br><span class="font-normal">22/8</span></th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTablaAgenda">
                        <!-- Generado dinámicamente -->
                    </tbody>
                </table>
            </div>

            <div class="mt-2 text-xs font-semibold text-gray-700">
                Horario Seleccionado: <span id="infoTiempoActual" class="text-teal-700 font-bold">Cargando...</span>
            </div>
        </div>

        <!-- Campos ocultos de almacenamiento temporal -->
        <div class="hidden">
            <input type="text" id="inputFechaNueva">
            <input type="text" id="inputHoraNueva">
        </div>

        <!-- Botones de Acción -->
        <div class="flex justify-end gap-3 pt-4 border-t">
            <button onclick="window.close()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium transition">Cancelar</button>
            <button onclick="guardarAsignacion()" class="px-6 py-2 bg-teal-800 text-white rounded-lg hover:bg-teal-900 font-medium shadow transition">Guardar Cambios</button>
        </div>
    </div>

    <script>
        const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');
        
        const urlParams = new URLSearchParams(window.location.search);
        const solicitudId = urlParams.get('id');

        class GestorAgendaServicio {
            constructor() {
                this.horasDisponibles = ["08:00:00", "09:00:00", "10:00:00", "11:00:00", "12:00:00", "14:00:00", "15:00:00", "16:00:00", "17:00:00", "18:00:00", "19:00:00", "20:00:00"];
                this.fechasColumnas = ["2026-08-21", "2026-08-22"];
            }

            renderizarTabla(tbodyId, fechaSeleccionadaActual, horaSeleccionadaActual) {
                const tbody = document.getElementById(tbodyId);
                let html = '';

                this.horasDisponibles.forEach(hora => {
                    const horaCorta = hora.substring(0, 5);
                    html += `<tr class="border-b hover:bg-gray-100">`;
                    html += `<td class="p-2 border-r font-bold text-gray-700 bg-gray-50 text-xs">${horaCorta}</td>`;

                    this.fechasColumnas.forEach(fechaCol => {
                        const esSeleccionado = (fechaCol === fechaSeleccionadaActual && hora.substring(0,5) === (horaSeleccionadaActual || "").substring(0,5));
                        
                        // Lógica de bloqueo: Deshabilitar si la fecha/hora es anterior a la base o a la solicitud inicial
                        const esAnterior = fechaCol < fechaSeleccionadaActual || (fechaCol === fechaSeleccionadaActual && hora < horaSeleccionadaActual);

                        if (esAnterior) {
                            html += `<td class="p-2 text-gray-300 font-bold bg-gray-100 select-none border-r">X</td>`;
                        } else if (esSeleccionado) {
                            html += `<td onclick="seleccionarBloqueAgenda('${fechaCol}', '${hora}')" class="p-2 bg-teal-700 text-white font-bold cursor-pointer select-none border-r ring-2 ring-teal-400">Seleccionado</td>`;
                        } else {
                            html += `<td onclick="seleccionarBloqueAgenda('${fechaCol}', '${hora}')" class="p-2 text-teal-800 bg-white hover:bg-teal-50 cursor-pointer select-none border-r font-medium">Libre</td>`;
                        }
                    });

                    html += `</tr>`;
                });
                tbody.innerHTML = html;
            }
        }

        const agendaObj = new GestorAgendaServicio();
        let fechaTemporal = "";
        let horaTemporal = "";
        let fechaMinimaBase = "2026-08-21";
        let horaMinimaBase = "08:00:00";

        async function inicializarModulo() {
            if (!solicitudId) {
                alert("No se especificó un ID de solicitud.");
                window.close();
                return;
            }
            document.getElementById('labelSolicitudId').innerText = `ID: ${solicitudId}`;

            // 1. Cargar lista de móviles y técnicos desde la tabla 'moviles'
            const { data: moviles } = await client.from('moviles').select('movil_id, id_tecnico, celular, estado').eq('estado', 'activo');
            
            const selectTecnico = document.getElementById('selectTecnico');
            selectTecnico.innerHTML = '<option value="">-- Sin técnico asignado --</option>';

            const selectMovil = document.getElementById('selectMovil');
            selectMovil.innerHTML = '<option value="">-- Sin móvil asignado --</option>';

            if (moviles) {
                moviles.forEach(m => {
                    if (m.id_tecnico) {
                        selectTecnico.innerHTML += `<option value="${m.id_tecnico}">Técnico ID: ${m.id_tecnico}</option>`;
                    }
                    if (m.movil_id) {
                        selectMovil.innerHTML += `<option value="${m.movil_id}">${m.movil_id} (Cel: ${m.celular})</option>`;
                    }
                });
            }

            // 2. Cargar datos actuales de la solicitud
            const { data: sol, error } = await client.from('solicitudes').select('*').eq('solicitud_id', solicitudId).single();
            if (error || !sol) {
                alert("No se pudo cargar la información de la solicitud.");
                return;
            }

            if (sol.id_tecnico) selectTecnico.value = sol.id_tecnico;
            if (sol.movil_id) selectMovil.value = sol.movil_id;
            if (sol.respuesta_solicitud) document.getElementById('selectEstado').value = sol.respuesta_solicitud.toLowerCase();

            fechaTemporal = sol.fecha_solicitud || "2026-08-21";
            horaTemporal = sol.hora_solicitud || "08:00:00";
            fechaMinimaBase = fechaTemporal;
            horaMinimaBase = horaTemporal;

            document.getElementById('infoTiempoActual').innerText = `${fechaTemporal} a Hrs. ${horaTemporal.substring(0, 5)}`;
            document.getElementById('inputFechaNueva').value = fechaTemporal;
            document.getElementById('inputHoraNueva').value = horaTemporal;

            agendaObj.renderizarTabla('cuerpoTablaAgenda', fechaTemporal, horaTemporal);
        }

        function seleccionarBloqueAgenda(fecha, hora) {
            // Validar que no se seleccione un horario anterior al mínimo establecido en la solicitud
            if (fecha < fechaMinimaBase || (fecha === fechaMinimaBase && hora < horaMinimaBase)) {
                alert("No puede seleccionar un horario anterior a la fecha y hora original de la solicitud.");
                return;
            }

            fechaTemporal = fecha;
            horaTemporal = hora;
            document.getElementById('inputFechaNueva').value = fecha;
            document.getElementById('inputHoraNueva').value = hora;
            document.getElementById('infoTiempoActual').innerText = `${fecha} a Hrs. ${hora.substring(0, 5)}`;
            
            agendaObj.renderizarTabla('cuerpoTablaAgenda', fechaTemporal, horaTemporal);
        }

        async function guardarAsignacion() {
            const nuevoTecnico = document.getElementById('selectTecnico').value;
            const nuevoMovil = document.getElementById('selectMovil').value;
            const nuevoEstado = document.getElementById('selectEstado').value;
            const nuevaFecha = document.getElementById('inputFechaNueva').value;
            const nuevaHora = document.getElementById('inputHoraNueva').value;

            const datosActualizacion = {
                id_tecnico: nuevoTecnico || null,
                movil_id: nuevoMovil || null,
                respuesta_solicitud: nuevoEstado,
                fecha_solicitud: nuevaFecha,
                hora_solicitud: nuevaHora
            };

            const { error } = await client.from('solicitudes').update(datosActualizacion).eq('solicitud_id', solicitudId);

            if (error) {
                alert("Error al actualizar la solicitud: " + error.message);
            } else {
                alert("¡Asignación, móvil, estado y horario actualizados correctamente!");
                if (window.opener && !window.opener.closed) {
                    window.opener.refrescarPanel();
                }
                window.close();
            }
        }

        document.addEventListener('DOMContentLoaded', inicializarModulo);
    </script>
</body>
</html>
