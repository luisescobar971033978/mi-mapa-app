<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PROGRAME SU SERVICIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .form-container { position: relative; background-color: rgba(255, 255, 255, 0.95); overflow: hidden; }
        .watermark { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('logo_1.jpeg'); background-repeat: no-repeat; background-position: center; background-size: contain; opacity: 0.1; z-index: 0; pointer-events: none; }
        .content-layer { position: relative; z-index: 10; }
        
        /* Animación para el giro 3D sobre el eje vertical */
        @keyframes girar3D {
            0% { transform: perspective(600px) rotateY(0deg); }
            100% { transform: perspective(600px) rotateY(360deg); }
        }

        .logo-giratorio {
            animation: girar3D 4s linear infinite;
            transform-style: preserve-3d;
        }

        /* Mejora responsiva para la tabla en móviles */
        @media (max-width: 480px) {
            .tabla-agenda { 
                font-size: 8px !important; 
                table-layout: fixed; 
            }
            .tabla-agenda th, .tabla-agenda td { 
                padding: 2px 1px !important; 
                overflow: hidden;
                white-space: nowrap; 
            }
        }

        /* Asistente Flotante Fijo en la Esquina Inferior Izquierda (Acompaña siempre la vista) */
        #asistente-flotante {
            position: fixed !important;
            bottom: 20px !important;
            left: 16px !important;
            max-width: 260px !important;
            background: rgba(255, 255, 255, 0.97) !important;
            background-color: rgba(255, 255, 255, 0.97) !important;
            backdrop-filter: blur(6px) !important;
            -webkit-backdrop-filter: blur(6px) !important;
            color: #0f766e;
            border: 2px solid #ff007f;
            padding: 10px 12px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.35);
            font-size: 11px;
            font-weight: bold;
            font-family: sans-serif;
            z-index: 2147483647;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            animation: flotar 2s ease-in-out infinite;
        }

        #asistente-flotante .flecha {
            font-size: 16px;
            color: #ff007f;
            animation: apuntar 1s ease-in-out infinite alternate;
            display: inline-block;
            flex-shrink: 0;
        }

        #texto-asistente {
            background: transparent !important;
            color: #134e4a;
            width: 100%;
            line-height: 1.2;
        }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        @keyframes apuntar {
            0% { transform: translateX(0); }
            100% { transform: translateX(4px); }
        }

        /* Estilo visual sutil para resaltar el campo que el usuario debe completar */
        .resaltar-pendu {
            border-color: #ff007f !important;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4) !important;
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 pb-28">
    <div class="w-[98%] md:max-w-md bg-white p-6 md:p-8 rounded-2xl shadow-xl form-container">
        <div class="watermark"></div>
        
        <div class="content-layer">
            <div id="btnCerrar" class="hidden absolute top-4 left-4 cursor-pointer" onclick="cerrarSesion()">
                <span class="text-3xl" title="Finalizar ciclo">🚪</span>
            </div>

            <!-- Cabecera unificada en una sola línea centrada -->
            <div class="flex items-center justify-center gap-2 mb-6 mt-2">
                <img src="logo_3d.png" alt="Logotipo Empresa" class="w-10 h-10 md:w-12 md:h-12 object-contain logo-giratorio flex-shrink-0">
                <h2 class="text-lg md:text-xl font-bold text-teal-900 text-center tracking-tight">PROGRAME SU SERVICIO</h2>
                <div class="cursor-pointer text-xl flex-shrink-0 ml-1" 
                     onclick="mostrarModal('¿Cómo funciona?', '1. Ingrese su Nombre y Celular.\n2. Seleccione el tipo de servicio requerido.\n3. Elija la Fecha y Hora disponible en la agenda.\n4. Presione el botón Solicitar Servicio.\n5. Desplace y marque su ubicación exacta en el mapa satelital.\n6. Presione Confirmar Ubicación.\n7. En la pantalla de espera, presione el botón INICIAR SEGUIMIENTO.\n8. Converse con el técnico en el chat mientras visualiza cómo se aproxima la unidad móvil de apoyo.')">
                    ℹ️
                </div>
            </div>
            
            <form id="solicitudForm" class="space-y-4">
                <input type="text" id="nombre" placeholder="Por favor colocar, Nombre del Contacto" class="w-full p-3 border rounded-lg" required>
                <input type="number" id="celular" placeholder="Escriba el No. Celular del Contacto" class="w-full p-3 border rounded-lg" required>
                <select id="opcion_servicio" class="w-full p-3 border rounded-lg" required onchange="verificarOtro()">
                    <option value="">SELECCIONE SU PROBLEMA</option>
                    <option value="Otro">Otro, describa su problema</option>
                    <option value="Fumigación contra El dengue y chikungunya">Fumigación contra El dengue y chikungunya</option>
                    <option value="Desbrozado de entrada, patios y Jardines">Desbrozado de entrada, patios y Jardines</option>
                    <option value="Problemas de Plomería">Problemas de Plomería</option>
                    <option value="Fuga de Agua">Fuga de Agua</option>
                    <option value="Tuberías trancadas del drenaje sanitario y de lluvias">Tuberías trancadas del drenaje sanitario y de lluvias</option>
                    <option value="Mi Ducha Eléctrica NO funciona">Mi Ducha Eléctrica NO funciona</option>
                    <option value="Interruptor / Tomacorriente NO funciona">Interruptor / Tomacorriente NO funciona</option>
                    <option value="Requiero Solución definitiva para GOTERAS">Requiero Solución definitiva para GOTERAS</option>
                    <option value="Mantenimiento de AIRE ACONDICIONADO">Mantenimiento de AIRE ACONDICIONADO</option>
                    <option value="Instalación de AIRE ACONDICIONADO">Instalación de AIRE ACONDICIONADO</option>
                    <option value="Servicio control de Humedad en Paredes">Servicio control de Humedad en Paredes</option>
                    <option value="Retoques de pintura en Fachada, Puertas de Acceso, Etc.">Retoques de pintura en Fachada, Puertas de Acceso, Etc.</option>
                    <option value="Fumigación contra plagas de jardines (Pulgón, mosca Blanca, Petillas, ácaros Etc.)">Fumigación contra plagas de jardines (Pulgón, mosca Blanca, Petillas, ácaros Etc.)</option>
                    <option value="Necesito aplicar veneno para los Sepes">Necesito aplicar veneno para los Sepes</option>
                    <option value="Remodelación de Vivienda y Oficinas">Remodelación de Vivienda y Oficinas</option>
                    <option value="Ampliación de Vivienda y Oficinas">Ampliación de Vivienda y Oficinas</option>
                </select>
                <div id="otroCampo" class="hidden"><textarea id="descripcion" placeholder="Por favor describa aquí su problema" class="w-full p-3 border rounded-lg"></textarea></div>
                
                <!-- Contenedor del Calendario -->
                <div class="mt-4 mb-6">
                    <label class="block text-sm font-bold text-teal-900 mb-2">SELECCIONE FECHA Y HORA:</label>
                    <div class="overflow-x-auto w-full -mx-2 md:mx-0">
                        <table class="w-full text-[8px] md:text-xs text-center border-collapse border border-gray-300 tabla-agenda" id="tablaAgenda">
                            <thead class="bg-teal-100">
                                <tr>
                                    <th class="p-1 border">Hora</th>
                                    <th class="p-1 border" id="head-0">LUN</th>
                                    <th class="p-1 border" id="head-1">MAR</th>
                                    <th class="p-1 border" id="head-2">MIÉ</th>
                                    <th class="p-1 border" id="head-3">JUE</th>
                                    <th class="p-1 border" id="head-4">VIE</th>
                                    <th class="p-1 border" id="head-5">SÁB</th>
                                    <th class="p-1 border" id="head-6">DOM</th>
                                </tr>
                            </thead>
                            <tbody id="cuerpoAgenda"></tbody>
                        </table>
                    </div>
                    <input type="hidden" id="fecha_seleccion" required>
                    <input type="hidden" id="hora_seleccionada" required>
                </div>

                <button type="submit" id="btnSolicitar" class="w-full bg-teal-800 text-white p-4 rounded-xl font-bold">SOLICITAR SERVICIO</button>
            </form>

            <a href="https://wa.me/59173694080?text=Hola,%20deseo%20solicitar%20una%20cotización%20o%20inspección%20para%20un%20servicio%20en%20mi%20hogar." 
               target="_blank" 
               class="w-full flex items-center justify-center bg-[#25D366] text-white p-4 rounded-xl font-bold shadow-lg mt-4 hover:bg-[#128C7E] transition-colors">
               <span class="mr-2">💬</span> Contactar por WhatsApp
            </a>
        </div>
    </div>

    <div id="modalApp" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[2000]">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm text-center">
            <h3 id="modalTitulo" class="font-bold text-xl mb-2 text-teal-900">Mensaje</h3>
            <p id="modalTexto" class="text-gray-700 mb-6"></p>
            <button id="modalBtn" onclick="cerrarModal()" class="w-full bg-teal-800 text-white p-3 rounded-xl font-bold">Aceptar</button>
        </div>
    </div>

    <!-- Asistente Flotante Direccional en la Esquina Inferior Izquierda -->
    <div id="asistente-flotante">
        <span class="flecha">👉</span>
        <span id="texto-asistente">Cargando guía...</span>
    </div>

<script type="module">
    import { inicializarAgenda } from './agenda.js';
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    // Inicializar agenda
    inicializarAgenda(client, 'tablaAgenda', 'fecha_seleccion', 'hora_seleccionada', 'btnSolicitar');

    function cerrarSesion() {
        localStorage.clear();
        location.reload();
    }

    function mostrarModal(titulo, texto, accion = null) {
        document.getElementById('modalTitulo').innerText = titulo;
        document.getElementById('modalTexto').innerText = texto;
        window.accionPostModal = accion;
        document.getElementById('modalApp').classList.remove('hidden');
    }
    
    function cerrarModal() {
        document.getElementById('modalApp').classList.add('hidden');
        if (window.accionPostModal) window.accionPostModal();
    }
    
    window.cerrarSesion = cerrarSesion;
    window.mostrarModal = mostrarModal;
    window.cerrarModal = cerrarModal;
    window.verificarOtro = () => {
        document.getElementById('otroCampo').classList.toggle('hidden', document.getElementById('opcion_servicio').value !== 'Otro');
        actualizarAsistente();
    };

    const contenedorAsistente = document.getElementById("asistente-flotante");
    const txtAsistente = document.getElementById("texto-asistente");
    const inputNombre = document.getElementById("nombre");
    const inputCelular = document.getElementById("celular");
    const selectProblema = document.getElementById("opcion_servicio");
    const inputDescripcion = document.getElementById("descripcion");
    const tablaHorarios = document.getElementById("tablaAgenda");
    const inputFechaSel = document.getElementById("fecha_seleccion");
    const inputHoraSel = document.getElementById("hora_seleccionada");
    const btnSolicitar = document.getElementById("btnSolicitar");

    function limpiarResaltados() {
        [inputNombre, inputCelular, selectProblema, inputDescripcion, tablaHorarios, btnSolicitar].forEach(el => {
            if (el) el.classList.remove('resaltar-pendu');
        });
    }

    function actualizarAsistente() {
        limpiarResaltados();

        const nombreVal = inputNombre ? inputNombre.value.trim() : "";
        const celularVal = inputCelular ? inputCelular.value.trim() : "";
        const problemaVal = selectProblema ? selectProblema.value : "";
        const esOtro = problemaVal === "Otro";
        const descripcionVal = inputDescripcion ? inputDescripcion.value.trim() : "";
        const fechaVal = inputFechaSel ? inputFechaSel.value : "";
        const horaVal = inputHoraSel ? inputHoraSel.value : "";
        const horaDiaSeleccionada = (fechaVal !== "" && horaVal !== "");

        if (!nombreVal) {
            txtAsistente.textContent = "👉 Falta colocar su Nombre";
            if (inputNombre) inputNombre.classList.add('resaltar-pendu');
            return;
        }

        if (!celularVal) {
            txtAsistente.textContent = "👉 Falta colocar Su número de Celular";
            if (inputCelular) inputCelular.classList.add('resaltar-pendu');
            return;
        }

        if (!problemaVal || problemaVal === "") {
            txtAsistente.textContent = "👉 Falta seleccionar el problema de la lista desplegada";
            if (selectProblema) selectProblema.classList.add('resaltar-pendu');
            return;
        }

        if (esOtro && !descripcionVal) {
            txtAsistente.textContent = "👉 Falta describir su requerimiento específico";
            if (inputDescripcion) inputDescripcion.classList.add('resaltar-pendu');
            return;
        }

        if (!horaDiaSeleccionada) {
            txtAsistente.textContent = "👉 Falta seleccionar la Hora y el Día en la agenda";
            if (tablaHorarios) tablaHorarios.classList.add('resaltar-pendu');
            return;
        }

        txtAsistente.textContent = "👉 ¡Todo listo! Presione el botón SOLICITAR SERVICIO";
        if (btnSolicitar) btnSolicitar.classList.add('resaltar-pendu');
    }

    if (inputNombre) inputNombre.addEventListener("input", actualizarAsistente);
    if (inputCelular) inputCelular.addEventListener("input", actualizarAsistente);
    if (selectProblema) selectProblema.addEventListener("change", actualizarAsistente);
    if (inputDescripcion) inputDescripcion.addEventListener("input", actualizarAsistente);
    
    if (inputFechaSel) {
        const observer = new MutationObserver(actualizarAsistente);
        observer.observe(inputFechaSel, { attributes: true, childList: true, subtree: true, characterData: true });
    }
    if (tablaHorarios) {
        tablaHorarios.addEventListener("click", () => {
            setTimeout(actualizarAsistente, 100);
        });
    }

    document.getElementById('solicitudForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        if (contenedorAsistente) {
            contenedorAsistente.style.display = 'none';
        }
        
        const btnSubmit = document.getElementById('btnSolicitar');
        btnSubmit.innerText = "SOLICITANDO...";
        btnSubmit.className = "w-full bg-orange-500 text-white p-4 rounded-xl font-bold";
        btnSubmit.disabled = true;

        const { data, error } = await client.from('solicitudes').insert([{ 
            nombre_usuario: document.getElementById('nombre').value, 
            celular_contacto: document.getElementById('celular').value, 
            comentario_solicitud: (document.getElementById('opcion_servicio').value === 'Otro') ? document.getElementById('descripcion').value : document.getElementById('opcion_servicio').value,
            fecha_solicitud: document.getElementById('fecha_seleccion').value,
            hora_solicitud: document.getElementById('hora_seleccionada').value + ':00',
            respuesta_solicitud: 'iniciando'
        }]).select();
                
        if (error) { 
            mostrarModal("Error", error.message);
            btnSubmit.innerText = "SOLICITAR SERVICIO";
            btnSubmit.className = "w-full bg-teal-800 text-white p-4 rounded-xl font-bold";
            btnSubmit.disabled = false;
            if (contenedorAsistente) contenedorAsistente.style.display = 'flex';
        } else {
            localStorage.setItem('id_solicitud', data[0].solicitud_id);
            mostrarModal("¡Éxito!", "Presione Aceptar para marcar su ubicación y recibir un mensaje recordatorio con 30 minutos de anticipación del Servicio solicitado. ¡Gracias por favor mantenga la aplicación abierta!", () => { 
                window.location.href = 'mapa.html'; 
            });
        }
    });

    window.onload = async function() {
        actualizarAsistente();

        const servicioFinalizado = localStorage.getItem('servicio_finalizado');
        if (servicioFinalizado === 'true') {
            document.getElementById('btnCerrar').classList.remove('hidden');
            mostrarModal("Servicio Finalizado", "El servicio ha concluido. Presione la puerta (🚪) para CERRAR SESION e Iniciar otro Servicio.");
            return;
        }

        const idSolicitud = localStorage.getItem('id_solicitud');
        if (idSolicitud) {
            const { data } = await client.from('solicitudes').select('respuesta_solicitud').eq('solicitud_id', parseInt(idSolicitud)).maybeSingle();
            if (data) {
                if (data.respuesta_solicitud === 'iniciando' || data.respuesta_solicitud === 'pendiente') {
                    window.location.href = 'espera.html';
                } else if (data.respuesta_solicitud === 'aceptado') {
                    window.location.href = `mapa_usuario.html?id=${idSolicitud}`;
                }
            } else {
                localStorage.removeItem('id_solicitud');
            }
        }
    };
</script>
    
</body>
</html>
