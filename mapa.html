<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, #map { height: 100vh; width: 100vw; margin: 0; }
        /* Marcador fijo en el centro */
        .center-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 1000;
            pointer-events: none;
            font-size: 30px;
        }
    </style>
</head>
<body>
    <div class="center-marker">📍</div>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([-17.7833, -63.1821], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Ubicación inicial automática
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                map.setView([position.coords.latitude, position.coords.longitude], 15);
            });
        }

        // Función para enviar la posición a FlutterFlow cada vez que el mapa se detiene
        map.on('moveend', function() {
            var center = map.getCenter();
            // Verifica si existe la conexión con FlutterFlow
            if (window.FlutterFlow) {
                window.FlutterFlow.postMessage(JSON.stringify({
                    "lat": center.lat,
                    "lng": center.lng
                }));
            }
        });
    </script>
</body>
</html>
