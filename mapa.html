<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, #map { height: 100vh; width: 100vw; margin: 0; }
        .center-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); z-index: 1000; pointer-events: none; font-size: 30px; }
        #btnConfirmar { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; background-color: #0f766e; color: white; font-weight: bold; border: none; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="center-marker">📍</div>
    <div id="map"></div>
    <button id="btnConfirmar" onclick="guardarUbicacion()">CONFIRMAR UBICACIÓN</button>

    <div id="modalApp" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[2000]">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm text-center">
            <h3 id="modalTitulo" class="font-bold text-xl mb-2 text-teal-900">Mensaje</h3>
            <p id="modalTexto" class="text-gray-700 mb-6"></p>
            <button id="modalBtn" onclick="cerrarModal()" class="w-full bg-teal-800 text-white p-3 rounded-xl font-bold">Aceptar</button>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
        const client = supabase.createClient(supabaseUrl, supabaseKey);
        var map = L.map('map').setView([-17.7833, -63.1821], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        function mostrarModal(titulo, texto, accion = null) {
            document.getElementById('modalTitulo').innerText = titulo;
            document.getElementById('modalTexto').innerText = texto;
            window.accionPostModal = accion;
            document.getElementById('modalApp').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('modalApp').classList.add('hidden');
            if (window.accionPostModal) {
                window.accionPostModal();
                window.accionPostModal = null; // Limpiar acción tras ejecutar
            }
        }

        async function guardarUbicacion() {
    const idSolicitud = localStorage.getItem('id_solicitud');
    var center = map.getCenter();

    // Diagnóstico 1: ¿Qué estamos tratando de guardar?
    console.log("ID recuperado:", idSolicitud);
    console.log("Coordenadas:", center.lat, center.lng);

    if (!idSolicitud || idSolicitud === 'null') { 
        mostrarModal("Error", "ID de solicitud no encontrado. Regrese al inicio."); 
        return; 
    }
    
    // Diagnóstico 2: Intentar la actualización
    try {
        const { data, error } = await client
            .from('solicitudes')
            .update({ 
                latitud: center.lat, 
                longitud: center.lng 
            })
            .eq('solicitud_id', parseInt(idSolicitud))
            .select(); // Agregamos select para verificar qué se actualizó
        
        if (error) { 
            mostrarModal("Error de BD", error.message); 
            console.error("Error Supabase:", error);
        } else {
            console.log("Respuesta de Supabase:", data);
            
            // Limpiamos y confirmamos
            localStorage.removeItem('id_solicitud');
            
            mostrarModal("¡Éxito!", "Ubicación guardada correctamente.", () => { 
                window.location.href = 'index.html'; 
            });
        }
    } catch (err) {
        mostrarModal("Error crítico", "Hubo un fallo inesperado: " + err.message);
    }
}
    </script>
</body>
</html>
