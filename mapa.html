<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, #map { height: 100vh; width: 100vw; margin: 0; }
        .hidden { display: none; }
        .center-marker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); z-index: 1000; pointer-events: none; font-size: 30px; }
        #btnConfirmar { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); z-index: 1000; padding: 15px 30px; background-color: #0f766e; color: white; font-weight: bold; border: none; border-radius: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="center-marker">📍</div>
    <div id="map"></div>
    <button id="btnConfirmar" onclick="guardarUbicacion()">CONFIRMAR UBICACIÓN</button>

    <div id="modalApp" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-[2000]">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm text-center">
            <h3 id="modalTitulo" class="font-bold text-xl mb-2 text-teal-900">Mensaje</h3>
            <p id="modalTexto" class="text-gray-700 mb-6"></p>
            <button id="modalBtn" class="w-full bg-teal-800 text-white p-3 rounded-xl font-bold">Aceptar</button>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);
    
    // Inicialización del mapa con capa híbrida ArcGIS y zoom 18
    var map = L.map('map').setView([-17.7833, -63.1821], 18);
    
    // Capa base: Satélite
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 19
    }).addTo(map);

    // Capa superior: Etiquetas (Híbrido)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
        opacity: 0.7,
        maxZoom: 19
    }).addTo(map);

    // Intento de geolocalización optimizado
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                map.setView([pos.coords.latitude, pos.coords.longitude], 18);
            },
            (err) => {
                console.log("Ubicación no disponible, usando centro por defecto.");
            },
            { 
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            }
        );
    }

    let guardando = false;

    async function guardarUbicacion() {
        if (guardando) return;
        
        const idSolicitud = localStorage.getItem('id_solicitud');
        var center = map.getCenter();

        if (!idSolicitud) { 
            mostrarModal("Error", "No se encontró el ID de solicitud."); 
            return; 
        }

        guardando = true;
        document.getElementById('btnConfirmar').innerText = "GUARDANDO...";

        const { error } = await client
            .from('solicitudes')
            .update({ 
                latitud: center.lat, 
                longitud: center.lng,
                respuesta_solicitud: 'pendiente'
            })
            .eq('solicitud_id', parseInt(idSolicitud));

        if (error) {
            mostrarModal("Error", "Error al guardar: " + error.message);
            guardando = false;
            document.getElementById('btnConfirmar').innerText = "CONFIRMAR UBICACIÓN";
        } else {
            window.location.href = 'espera.html';
        }
    }

    function mostrarModal(titulo, texto) {
        document.getElementById('modalTitulo').innerText = titulo;
        document.getElementById('modalTexto').innerText = texto;
        document.getElementById('modalApp').classList.remove('hidden');
        document.getElementById('modalBtn').onclick = function() {
            document.getElementById('modalApp').classList.add('hidden');
        };
    }
</script>
</body>
</html>
