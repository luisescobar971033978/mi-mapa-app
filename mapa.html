<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, #map { height: 100vh; width: 100vw; margin: 0; }
        
        /* Marcador fijo en el centro */
        .center-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            z-index: 1000;
            pointer-events: none;
            font-size: 30px;
        }

        /* Botón de confirmar dentro del HTML */
        #btnConfirmar {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            padding: 15px 30px;
            background-color: #0f766e; /* Color elegante, adáptalo a tu diseño */
            color: white;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="center-marker">📍</div>
    <div id="map"></div>
    
    <button id="btnConfirmar" onclick="guardarUbicacion()">CONFIRMAR UBICACIÓN</button>

    <script>
        var map = L.map('map').setView([-17.7833, -63.1821], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Ubicación inicial automática
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                map.setView([position.coords.latitude, position.coords.longitude], 15);
            });
        }

        // Función asíncrona para guardar en Supabase
        async function guardarUbicacion() {
            var center = map.getCenter();
            var lat = center.lat;
            var lng = center.lng;

            // ⚠️ REEMPLAZA ESTOS DATOS CON LOS TUYOS DE SUPABASE
            const supabaseUrl = 'https://xxxxxx.supabase.co/rest/v1/tu_tabla'; 
            const supabaseKey = 'tu_anon_key'; 

            try {
                let response = await fetch(supabaseUrl, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': 'Bearer ' + supabaseKey,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify({
                        latitud: lat,  // Asegúrate que el nombre de la columna coincida en Supabase
                        longitud: lng  // Asegúrate que el nombre de la columna coincida en Supabase
                    })
                });

                if (response.ok) {
                    alert("¡Ubicación guardada con éxito!");
                    // Aquí puedes redirigir a otra pantalla o avisar al usuario
                } else {
                    let error = await response.json();
                    alert("Error al guardar en Supabase: " + JSON.stringify(error));
                }
            } catch (e) {
                alert("Error de red: " + e.message);
            }
        }
    </script>
</body>
</html>
