<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, #map { height: 100vh; width: 100vw; margin: 0; }
        .center-marker {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -100%);
            z-index: 1000; pointer-events: none; font-size: 30px;
        }
        #btnConfirmar {
            position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%); z-index: 1000;
            padding: 15px 30px; background-color: #0f766e;
            color: white; font-size: 16px; font-weight: bold;
            border: none; border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="center-marker">📍</div>
    <div id="map"></div>
    <button id="btnConfirmar" onclick="guardarUbicacion()">CONFIRMAR UBICACIÓN</button>

    <script>
        const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        var map = L.map('map').setView([-17.7833, -63.1821], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                map.setView([position.coords.latitude, position.coords.longitude], 15);
            });
        }

        async function guardarUbicacion() {
            var center = map.getCenter();
            const idSolicitud = localStorage.getItem('id_solicitud');

            // Validación robusta: Si no hay ID, informamos y regresamos al inicio
            if (!idSolicitud || idSolicitud === 'undefined' || idSolicitud === 'null') {
                alert("Error: No se encontró una solicitud activa. Por favor, rellene el formulario primero.");
                window.location.href = 'index.html';
                return;
            }

            // Actualizamos en la tabla 'solicitudes' usando la columna correcta
            const { error } = await client
                .from('solicitudes')
                .update({ 
                    latitud: center.lat, 
                    longitud: center.lng 
                })
                .eq('solicitud_id', parseInt(idSolicitud)); // Aseguramos que sea un número (Integer)

            if (error) {
                alert("Error al guardar ubicación: " + error.message);
                console.error("Detalle del error:", error);
            } else {
                alert("¡SU UBICACION FUE GUARDADA CON EXITO, POR FAVOR AGUARDE UNOS INSTANTES ESTAMOS PROGRAMANDO SU SOLICITUD!");
                
                // Limpiamos y reiniciamos
                localStorage.removeItem('id_solicitud');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
