<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <nav class="bg-teal-900 text-white p-4 text-center shadow-lg">
        <h1 class="text-xl font-bold">MANTENIMIENTO Y SOLUCIONES PARA EL HOGAR Y OFICINA</h1>
    </nav>

    <div class="container mx-auto p-4 space-y-8">
        
        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">1.- TECNICOS Y MOVILES DISPONIBLES</h2>
            <div class="bg-white rounded shadow p-4 overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th class="p-2">Móvil</th>
                            <th class="p-2">Celular</th>
                            <th class="p-2">Estado</th>
                            <th class="p-2">ID Técnico</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMoviles"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">2.- FLUJO GENERAL DE SERVICIOS</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                    <p class="text-gray-500 text-sm">Pendientes</p>
                    <h2 id="countPendientes" class="text-2xl font-bold">0</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">En Camino</p>
                    <h2 id="countEnCamino" class="text-2xl font-bold">0</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">Finalizados</p>
                    <h2 id="countFinalizados" class="text-2xl font-bold">0</h2>
                </div>
            </div>
            <div class="bg-white rounded shadow overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Técnico</th>
                            <th class="p-3">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes"></tbody>
                </table>
            </div>
        </section>

        <section class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-bold text-teal-900 mb-4">3.- ESTADISTICAS</h2>
            <div style="height: 500px;">
                <canvas id="graficoServicios"></canvas>
            </div>
        </section>
    </div>

    <script>
        const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
        const client = supabase.createClient(supabaseUrl, supabaseKey);
        let miGrafico;

        async function cargarTodo() {
            // 1. Cargar Móviles
            const { data: moviles } = await client.from('moviles').select('*');
            document.getElementById('tablaMoviles').innerHTML = moviles.map(m => `
                <tr class="border-b">
                    <td class="p-2">${m.movil_id}</td>
                    <td class="p-2">${m.celular}</td>
                    <td class="p-2 font-bold ${m.estado === 'activo' ? 'text-green-600' : 'text-red-600'}">${m.estado}</td>
                    <td class="p-2">${m.id_tecnico || 'Libre'}</td>
                </tr>
            `).join('');

            // 2. Cargar Solicitudes
            const { data: solicitudes } = await client.from('solicitudes').select('*').order('solicitud_id', { ascending: false });
            
            document.getElementById('countPendientes').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'pendiente').length;
            document.getElementById('countEnCamino').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'aceptado').length;
            document.getElementById('countFinalizados').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'finalizado').length;

            document.getElementById('tablaSolicitudes').innerHTML = solicitudes.map(s => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3">${s.solicitud_id}</td>
                    <td class="p-3">${s.nombre_usuario || 'Anónimo'}</td>
                    <td class="p-3">${s.id_tecnico || 'Sin asignar'}</td>
                    <td class="p-3 font-bold">${s.respuesta_solicitud.toUpperCase()}</td>
                </tr>
            `).join('');

            // 3. Actualizar Gráfico
            actualizarGrafico(solicitudes);
        }

        function actualizarGrafico(solicitudes) {
            const ctx = document.getElementById('graficoServicios').getContext('2d');
            const conteo = {};
            const total = solicitudes.length;
            
            solicitudes.forEach(s => {
                const tipo = s.comentario_solicitud || 'Otro';
                conteo[tipo] = (conteo[tipo] || 0) + 1;
            });

            if (miGrafico) miGrafico.destroy();
            miGrafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(conteo),
                    datasets: [{
                        label: '% Incidencia',
                        data: Object.values(conteo).map(c => total > 0 ? ((c / total) * 100).toFixed(1) : 0),
                        backgroundColor: '#0f766e'
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { x: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } }
                }
            });
        }

        cargarTodo();
        client.channel('admin_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'moviles' }, cargarTodo)
            .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, cargarTodo)
            .subscribe();
    </script>
</body>
</html>
