<!DOCTYPE html>

<body class="bg-gray-50 min-h-screen">
    
    <nav class="bg-teal-900 text-white p-4 text-center shadow-lg">

    <div id="toolbar" class="sticky top-0 z-50 bg-white border-b border-gray-200 p-3 shadow-md flex flex-wrap gap-2 justify-center text-sm font-semibold">

        <button id="btnEditar" onclick="editarElemento()" class="transition-opacity duration-300 hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>✏️ Editar</button>
        <button id="btnBorrar" onclick="borrarElemento()" class="transition-opacity duration-300 hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>🗑️ Borrar</button>
        <button id="btnAsignar" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>👤 Asignar</button>
        <button id="btnMensaje" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>💬 Mensaje</button>
        <button id="btnFinalizar" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>✅ Finalizar</button>

    <div class="container mx-auto p-4 space-y-8">
        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">1.- TECNICOS Y MOVILES DISPONIBLES</h2>
            <div class="bg-white rounded shadow p-4 overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-2">Móvil</th><th class="p-2">Celular</th><th class="p-2">Estado</th><th class="p-2">ID Técnico</th></tr>
                    </thead>
                    <tbody id="tablaMoviles"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">2.- FLUJO GENERAL DE SERVICIOS</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500"><p class="text-gray-500 text-sm">Pendientes</p><h2 id="countPendientes" class="text-2xl font-bold">0</h2></div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500"><p class="text-gray-500 text-sm">En Camino</p><h2 id="countEnCamino" class="text-2xl font-bold">0</h2></div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500"><p class="text-gray-500 text-sm">Finalizados</p><h2 id="countFinalizados" class="text-2xl font-bold">0</h2></div>
            </div>
            <div class="bg-white rounded shadow overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-3">ID</th><th class="p-3">Cliente</th><th class="p-3">Técnico</th><th class="p-3">Estado</th></tr>
                    </thead>
                    <tbody id="tablaSolicitudes"></tbody>
                </table>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold text-teal-900 mb-4">3.- INCIDENCIA POR SERVICIO</h2>
                <div style="height: 400px;"><canvas id="graficoServicios"></canvas></div>
                <table class="w-full mt-4 text-sm"><tbody id="tablaIncidencia"></tbody></table>
            </section>
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold text-teal-900 mb-4">4.- PRODUCTIVIDAD POR TECNICO</h2>
                <div style="height: 400px;"><canvas id="graficoProductividad"></canvas></div>
                <table class="w-full mt-4 text-sm"><tbody id="tablaProductividad"></tbody></table>
            </section>
        </div>
    </div>

    <script>
        const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');
        let chartIncidencia, chartProductividad;
        let elementoSeleccionado = { id: null, tipo: null };

        // Función de color restaurada y mejorada
        
function getColor(v, arr) {
    // 1. Ordenamos los valores de mayor a menor para determinar el ranking
    const sorted = [...arr].sort((a, b) => b - a);
    
    // 2. Identificamos el valor máximo y el valor mínimo
    const max = sorted[0];
    const min = sorted[sorted.length - 1];

    // 3. Casos especiales para el podio
    if (v === max && sorted.length >= 1) return '#0f766e'; // 1er lugar: Verde (Teal oscuro)
    if (v === sorted[1]) return '#f97316';                 // 2do lugar: Naranja
    if (v === sorted[2]) return '#eab308';                 // 3er lugar: Amarillo

    // 4. Color para el valor mínimo absoluto
    if (v === min) return '#dc2626';                       // Mínimo: Rojo

    // 5. Escala para valores restantes (intermedios entre 3er lugar y mínimo)
    return '#14b8a6'; // Teal intermedio para el resto de datos
}

        // Agrega esta variable global arriba junto a las otras
let filaSeleccionada = null; 

function seleccionarElemento(id, tipo, event) {
    elementoSeleccionado = { id, tipo };
    
    // Resaltamos la fila visualmente
    document.querySelectorAll('tr').forEach(tr => tr.classList.remove('bg-teal-100'));
    const fila = event.target.closest('tr');
    if (fila) {
        fila.classList.add('bg-teal-100');
        filaSeleccionada = fila; // Guardamos la referencia a la fila
    }

    // Lógica original de botones
    const botones = { btnVer: (tipo === 'solicitud'), btnEditar: (tipo === 'movil'), btnBorrar: (tipo === 'solicitud'), btnAsignar: (tipo === 'solicitud'), btnMensaje: (tipo === 'solicitud'), btnFinalizar: (tipo === 'solicitud') };
    Object.keys(botones).forEach(idBtn => {
        const btn = document.getElementById(idBtn);
        if (btn) {
            btn.disabled = !botones[idBtn];
            btn.classList.toggle('opacity-50', btn.disabled);
            btn.classList.toggle('cursor-not-allowed', btn.disabled);
        }
    });
}

        async function cargarTodo() {
            const { data: moviles } = await client.from('moviles').select('*');
            if (moviles) {
                document.getElementById('tablaMoviles').innerHTML = moviles.map(m => `
                    <tr class="cursor-pointer hover:bg-gray-100 transition-colors" onclick="seleccionarElemento('${m.movil_id}', 'movil', event)">
                        <td class="p-2">${m.movil_id}</td>
                        <td class="p-2">${m.celular}</td>
                        <td class="p-2 font-bold ${m.estado === 'activo' ? 'text-green-600' : 'text-red-600'}">${m.estado}</td>
                        <td class="p-2">${m.id_tecnico || 'Libre'}</td>
                    </tr>`).join('');
            }
            const { data: solicitudes } = await client.from('solicitudes').select('*').order('solicitud_id', { ascending: false });
            if (solicitudes) {
                document.getElementById('countPendientes').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'pendiente').length;
                document.getElementById('countEnCamino').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'aceptado').length;
                document.getElementById('countFinalizados').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'finalizado').length;
                document.getElementById('tablaSolicitudes').innerHTML = solicitudes.map(s => `
                    <tr class="cursor-pointer hover:bg-gray-100 transition-colors" onclick="seleccionarElemento('${s.solicitud_id}', 'solicitud', event)">
                        <td class="p-3">${s.solicitud_id}</td>
                        <td class="p-3">${s.nombre_usuario || 'Anónimo'}</td>
                        <td class="p-3">${s.id_tecnico || 'Sin asignar'}</td>
                        <td class="p-3 font-bold">${s.respuesta_solicitud.toUpperCase()}</td>
                    </tr>`).join('');
                actualizarGraficos(solicitudes);
            }
        }

        function actualizarGraficos(solicitudes) {
            const serviciosValidos = ["Fumigación contra El dengue y chikungunya", "Desbrozado de entrada, patios y Jardines", "Problemas de Plomería", "Fuga de Agua", "Tuberías trancadas del drenaje sanitario y de lluvias", "Mi Ducha Eléctrica NO funciona", "Interruptor / Tomacorriente NO funciona", "Requiero Solución definitiva para GOTERAS", "Mantenimiento de AIRE ACONDICIONADO", "Instalación de AIRE ACONDICIONADO", "Servicio control de Humedad en Paredes", "Retoques de pintura en Fachada, Puertas de Acceso, Etc.", "Fumigación contra plagas de jardines (Pulgón, mosca Blanca, Petillas, ácaros Etc.)", "Necesito aplicar veneno para los Sepes", "Remodelación de Vivienda y Oficinas", "Ampliación de Vivienda y Oficinas"];
            const conteo = {};
            solicitudes.forEach(s => { const cat = serviciosValidos.includes(s.comentario_solicitud) ? s.comentario_solicitud : "Otros"; conteo[cat] = (conteo[cat] || 0) + 1; });
            const labels = Object.keys(conteo);
            const data = Object.values(conteo).map(c => parseFloat(((c / solicitudes.length) * 100).toFixed(1)));
            const maxVal = Math.max(...data);
            if (chartIncidencia) chartIncidencia.destroy();
            chartIncidencia = new Chart(document.getElementById('graficoServicios').getContext('2d'), { type: 'bar', plugins: [ChartDataLabels], data: { labels, datasets: [{ data, backgroundColor: data.map(v => getColor(Number(v), data)) }] }, options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'right', formatter: v => v + '%', padding: 5 } }, scales: { x: { max: maxVal + 15, beginAtZero: true } } } });
            document.getElementById('tablaIncidencia').innerHTML = labels.map((l, i) => `<tr><td class="p-2">${l}</td><td class="p-2 text-right font-bold" style="color:${getColor(Number(data[i]), data)}">${data[i]}%</td></tr>`).join('');
            const finalizados = solicitudes.filter(s => s.respuesta_solicitud === 'finalizado');
            const cTech = {};
            finalizados.forEach(s => cTech[s.id_tecnico || 'Sin asignar'] = (cTech[s.id_tecnico || 'Sin asignar'] || 0) + 1);
            const lTech = Object.keys(cTech);
            const dTech = Object.values(cTech).map(c => parseFloat(((c / finalizados.length) * 100).toFixed(1)));
            const maxTech = Math.max(...dTech);
            if (chartProductividad) chartProductividad.destroy();
            chartProductividad = new Chart(document.getElementById('graficoProductividad').getContext('2d'), { type: 'bar', plugins: [ChartDataLabels], data: { labels: lTech, datasets: [{ data: dTech, backgroundColor: dTech.map(v => getColor(Number(v), dTech)) }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, datalabels: { anchor: 'end', align: 'top', formatter: v => v + '%' } }, scales: { y: { max: maxTech + 15, beginAtZero: true } } } });
            document.getElementById('tablaProductividad').innerHTML = lTech.map((l, i) => `<tr><td class="p-2">${l}</td><td class="p-2 text-right font-bold" style="color:${getColor(Number(dTech[i]), dTech)}">${dTech[i]}%</td></tr>`).join('');
        }
        
        // ... (resto de funciones de edición y borrado sin cambios)

        async function editarElemento() {
    if (elementoSeleccionado.tipo !== 'movil') return;

    // Pedimos el campo directamente (se puede mejorar para que sea un menú desplegable)
    const campo = prompt("¿Qué desea editar? Escriba: estado, celular, o id_tecnico");
    
    if (!campo || !['estado', 'celular', 'id_tecnico'].includes(campo.toLowerCase())) {
        alert("Campo no válido. Debe ser: estado, celular o id_tecnico");
        return;
    }

    const nuevoValor = prompt(`Ingrese el nuevo valor para ${campo.toLowerCase()}:`);
    if (nuevoValor === null) return;

    const { error } = await client
        .from('moviles')
        .update({ [campo.toLowerCase()]: nuevoValor })
        .eq('movil_id', elementoSeleccionado.id);

    if (error) {
        alert("Error al actualizar: " + error.message);
    } else {
        alert("¡Actualización exitosa!");
        cargarTodo(); // Refresca la tabla y mantiene el orden
    }
}

        async function borrarElemento() {
            if (elementoSeleccionado.tipo !== 'solicitud') return;
            if (confirm("¿Borrar solicitud?")) {
                const { error } = await client.from('solicitudes').delete().eq('solicitud_id', elementoSeleccionado.id);
                if (error) alert("Error: " + error.message);
                else cargarTodo();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            cargarTodo();
            client.channel('admin_channel').on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, cargarTodo).subscribe();
        });
    </script>
</body>
