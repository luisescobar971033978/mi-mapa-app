<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body class="bg-gray-50 min-h-screen">
    
    <nav class="bg-teal-900 text-white p-4 text-center shadow-lg">
        <h1 class="text-xl font-bold">MANTENIMIENTO Y SOLUCIONES PARA EL HOGAR Y OFICINA</h1>
    </nav>

    <div id="toolbar" class="sticky top-0 z-50 bg-white border-b border-gray-200 p-3 shadow-md flex flex-wrap gap-2 justify-center text-sm font-semibold">
        <button onclick="cargarTodo()" class="hover:bg-gray-100 p-2 rounded">🔄 Refresh</button>
        <button id="btnVer" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>👁️ Ver</button>
        <button id="btnEditar" onclick="editarElemento()" class="transition-opacity duration-300 hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>✏️ Editar</button>
        <button id="btnBorrar" onclick="borrarElemento()" class="transition-opacity duration-300 hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>🗑️ Borrar</button>
        <button id="btnAsignar" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>👤 Asignar</button>
        <button id="btnMensaje" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>💬 Mensaje</button>
        <button id="btnFinalizar" class="hover:bg-gray-100 p-2 rounded opacity-50 cursor-not-allowed" disabled>✅ Finalizar</button>
        <div class="border-l border-gray-300 mx-2"></div>
        <button onclick="window.location.href='index.html'" class="hover:bg-gray-100 p-2 rounded">🚀 Solicitar Servicio</button>
        <button onclick="window.location.href='tecnico.html'" class="hover:bg-gray-100 p-2 rounded">🛠️ Solicitar Técnico</button>
        <button onclick="window.location.href='login.html'" class="hover:bg-gray-100 p-2 rounded text-red-600">🚪 Salir</button>
    </div>

    <div class="container mx-auto p-4 space-y-8">
        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">1.- TECNICOS Y MOVILES DISPONIBLES</h2>
            <div class="bg-white rounded shadow p-4 overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-2">Móvil</th><th class="p-2">Celular</th><th class="p-2">Estado</th><th class="p-2">ID Técnico</th></tr>
                    </thead>
                    <tbody id="tablaMoviles"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">2.- FLUJO GENERAL DE SERVICIOS</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500"><p class="text-gray-500 text-sm">Pendientes</p><h2 id="countPendientes" class="text-2xl font-bold">0</h2></div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500"><p class="text-gray-500 text-sm">En Camino</p><h2 id="countEnCamino" class="text-2xl font-bold">0</h2></div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500"><p class="text-gray-500 text-sm">Finalizados</p><h2 id="countFinalizados" class="text-2xl font-bold">0</h2></div>
            </div>
            <div class="bg-white rounded shadow overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-3">ID</th><th class="p-3">Cliente</th><th class="p-3">Técnico</th><th class="p-3">Estado</th></tr>
                    </thead>
                    <tbody id="tablaSolicitudes"></tbody>
                </table>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold text-teal-900 mb-4">3.- INCIDENCIA POR SERVICIO</h2>
                <div style="height: 400px;"><canvas id="graficoServicios"></canvas></div>
                <table class="w-full mt-4 text-sm"><tbody id="tablaIncidencia"></tbody></table>
            </section>
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold text-teal-900 mb-4">4.- PRODUCTIVIDAD POR TECNICO</h2>
                <div style="height: 400px;"><canvas id="graficoProductividad"></canvas></div>
                <table class="w-full mt-4 text-sm"><tbody id="tablaProductividad"></tbody></table>
            </section>
        </div>
    </div>

    <script>
    const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');
    let chartIncidencia, chartProductividad;
    let elementoSeleccionado = { id: null, tipo: null };

    function seleccionarElemento(id, tipo, event) {
    elementoSeleccionado = { id, tipo };
    
    document.querySelectorAll('tr').forEach(tr => tr.classList.remove('bg-teal-100'));
    const fila = event.target.closest('tr');
    if (fila) fila.classList.add('bg-teal-100');

    // Configuración de botones
    const botones = {
        btnVer: (tipo === 'solicitud'),
        btnEditar: (tipo === 'movil'),
        btnBorrar: (tipo === 'solicitud'),
        btnAsignar: (tipo === 'solicitud'),
        btnMensaje: (tipo === 'solicitud'),
        btnFinalizar: (tipo === 'solicitud')
    };

    Object.keys(botones).forEach(idBtn => {
        const btn = document.getElementById(idBtn);
        if (btn) {
            btn.disabled = !botones[idBtn];
            // FORZAR ESTILOS: si está habilitado, quitamos opacidad y cursor, si no, los ponemos
            if (!btn.disabled) {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
    });
}

    async function cargarTodo() {
        const { data: moviles } = await client.from('moviles').select('*');
        if (moviles) {
            document.getElementById('tablaMoviles').innerHTML = moviles.map(m => `
                <tr class="cursor-pointer hover:bg-gray-100 transition-colors" onclick="seleccionarElemento('${m.movil_id}', 'movil', event)">
                    <td class="p-2">${m.movil_id}</td>
                    <td class="p-2">${m.celular}</td>
                    <td class="p-2 font-bold ${m.estado === 'activo' ? 'text-green-600' : 'text-red-600'}">${m.estado}</td>
                    <td class="p-2">${m.id_tecnico || 'Libre'}</td>
                </tr>`).join('');
        }

        const { data: solicitudes } = await client.from('solicitudes').select('*').order('solicitud_id', { ascending: false });
        if (solicitudes) {
            document.getElementById('countPendientes').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'pendiente').length;
            document.getElementById('countEnCamino').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'aceptado').length;
            document.getElementById('countFinalizados').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'finalizado').length;
            
            document.getElementById('tablaSolicitudes').innerHTML = solicitudes.map(s => `
                <tr class="cursor-pointer hover:bg-gray-100 transition-colors" onclick="seleccionarElemento('${s.solicitud_id}', 'solicitud', event)">
                    <td class="p-3">${s.solicitud_id}</td>
                    <td class="p-3">${s.nombre_usuario || 'Anónimo'}</td>
                    <td class="p-3">${s.id_tecnico || 'Sin asignar'}</td>
                    <td class="p-3 font-bold">${s.respuesta_solicitud.toUpperCase()}</td>
                </tr>`).join('');
        }
    }
        // Función para Editar (específicamente para 'moviles')
async function editarElemento() {
    if (elementoSeleccionado.tipo !== 'movil') return;
    
    const nuevoEstado = prompt("Ingrese el nuevo estado (activo/inactivo):");
    if (!nuevoEstado) return;

    console.log("Intentando actualizar ID:", elementoSeleccionado.id, "con estado:", nuevoEstado);

    const { data, error } = await client
        .from('moviles')
        .update({ estado: nuevoEstado })
        .eq('movil_id', elementoSeleccionado.id);

    if (error) {
        console.error("Error de Supabase:", error);
        alert("Error al actualizar: " + error.message);
    } else {
        console.log("Éxito. Respuesta:", data);
        alert("Móvil actualizado exitosamente.");
        cargarTodo();
    }
}

// Función para Borrar (específicamente para 'solicitudes')
async function borrarElemento() {
    if (elementoSeleccionado.tipo !== 'solicitud') return;
    
    if (confirm("¿Estás seguro de que deseas eliminar esta solicitud? Esta acción no se puede deshacer.")) {
        const { error } = await client
            .from('solicitudes')
            .delete()
            .eq('solicitud_id', elementoSeleccionado.id);

        if (error) alert("Error al borrar: " + error.message);
        else {
            alert("Solicitud eliminada.");
            cargarTodo(); // Recargamos la tabla
        }
    }
}

    // Inicialización fuera de la función
    document.addEventListener('DOMContentLoaded', cargarTodo);
</script>
