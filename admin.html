<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <nav class="bg-teal-900 text-white p-4 shadow-lg">
        <h1 class="text-xl font-bold">ADMINISTRACIÓN CENTRAL</h1>
    </nav>

    <div class="container mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                <p class="text-gray-500 text-sm">Pendientes</p>
                <h2 id="countPendientes" class="text-2xl font-bold">0</h2>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">En Camino</p>
                <h2 id="countEnCamino" class="text-2xl font-bold">0</h2>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Finalizados</p>
                <h2 id="countFinalizados" class="text-2xl font-bold">0</h2>
            </div>
        </div>

        <div class="bg-white rounded shadow overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-100 border-b">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3">Cliente</th>
                        <th class="p-3">Técnico</th>
                        <th class="p-3">Estado</th>
                    </tr>
                </thead>
                <tbody id="tablaSolicitudes">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        async function cargarDatos() {
            // 1. Obtener todas las solicitudes
            const { data, error } = await client.from('solicitudes').select('*').order('solicitud_id', { ascending: false });

            if (error) {
                console.error("Error cargando datos:", error);
                return;
            }

            // 2. Actualizar contadores
            document.getElementById('countPendientes').innerText = data.filter(s => s.respuesta_solicitud === 'pendiente').length;
            document.getElementById('countEnCamino').innerText = data.filter(s => s.respuesta_solicitud === 'aceptado').length;
            document.getElementById('countFinalizados').innerText = data.filter(s => s.respuesta_solicitud === 'finalizado').length;

            // 3. Renderizar tabla
            const tbody = document.getElementById('tablaSolicitudes');
            tbody.innerHTML = data.map(s => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3">${s.solicitud_id}</td>
                    <td class="p-3">${s.nombre_usuario || 'Anónimo'}</td>
                    <td class="p-3">${s.id_tecnico || 'Sin asignar'}</td>
                    <td class="p-3 font-bold ${s.respuesta_solicitud === 'pendiente' ? 'text-yellow-600' : 'text-blue-600'}">
                        ${s.respuesta_solicitud.toUpperCase()}
                    </td>
                </tr>
            `).join('');
        }

        // 4. Suscripción a cambios en tiempo real (para que se actualice solo)
        client.channel('solicitudes_admin')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, () => {
                cargarDatos();
            })
            .subscribe();

        // Carga inicial al abrir la página
        cargarDatos();
    </script>
</body>
</html>
