<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <nav class="bg-teal-900 text-white p-4 text-center shadow-lg">
        <h1 class="text-xl font-bold">MANTENIMIENTO Y SOLUCIONES PARA EL HOGAR Y OFICINA</h1>
    </nav>

    <div class="container mx-auto p-4 space-y-8">
        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">1.- TECNICOS Y MOVILES DISPONIBLES</h2>
            <div class="bg-white rounded shadow p-4 overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-2">Móvil</th><th class="p-2">Celular</th><th class="p-2">Estado</th><th class="p-2">ID Técnico</th></tr>
                    </thead>
                    <tbody id="tablaMoviles"></tbody>
                </table>
            </div>
        </section>

        <section>
            <h2 class="text-xl font-bold text-teal-900 mb-4">2.- FLUJO GENERAL DE SERVICIOS</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                    <p class="text-gray-500 text-sm">Pendientes</p><h2 id="countPendientes" class="text-2xl font-bold">0</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                    <p class="text-gray-500 text-sm">En Camino</p><h2 id="countEnCamino" class="text-2xl font-bold">0</h2>
                </div>
                <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                    <p class="text-gray-500 text-sm">Finalizados</p><h2 id="countFinalizados" class="text-2xl font-bold">0</h2>
                </div>
            </div>
            <div class="bg-white rounded shadow overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 border-b">
                        <tr><th class="p-3">ID</th><th class="p-3">Cliente</th><th class="p-3">Técnico</th><th class="p-3">Estado</th></tr>
                    </thead>
                    <tbody id="tablaSolicitudes"></tbody>
                </table>
            </div>
        </section>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold text-teal-900 mb-4">3.- INCIDENCIA POR SERVICIO</h2>
                <div style="height: 400px;"><canvas id="graficoServicios"></canvas></div>
                <table class="w-full mt-4 text-sm"><tbody id="tablaIncidencia"></tbody></table>
            </section>
            <section class="bg-white p-6 rounded shadow">
                <h2 class="text-xl font-bold text-teal-900 mb-4">4.- PRODUCTIVIDAD POR TECNICO</h2>
                <div style="height: 400px;"><canvas id="graficoProductividad"></canvas></div>
                <table class="w-full mt-4 text-sm"><tbody id="tablaProductividad"></tbody></table>
            </section>
        </div>
    </div>

    <script>
        const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');
        let chartIncidencia, chartProductividad;

        function getColor(val, all) {
            const max = Math.max(...all);
            const min = Math.min(...all);
            if (val === max) return '#10b981';
            if (val === min) return '#ef4444';
            if (val > (max * 0.6)) return '#f59e0b';
            return '#eab308';
        }

        async function cargarTodo() {
            const { data: moviles } = await client.from('moviles').select('*');
            document.getElementById('tablaMoviles').innerHTML = moviles.map(m => `<tr><td class="p-2">${m.movil_id}</td><td class="p-2">${m.celular}</td><td class="p-2 font-bold ${m.estado === 'activo' ? 'text-green-600' : 'text-red-600'}">${m.estado}</td><td class="p-2">${m.id_tecnico || 'Libre'}</td></tr>`).join('');

            const { data: solicitudes } = await client.from('solicitudes').select('*').order('solicitud_id', { ascending: false });
            document.getElementById('countPendientes').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'pendiente').length;
            document.getElementById('countEnCamino').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'aceptado').length;
            document.getElementById('countFinalizados').innerText = solicitudes.filter(s => s.respuesta_solicitud === 'finalizado').length;
            
            document.getElementById('tablaSolicitudes').innerHTML = solicitudes.map(s => `<tr><td class="p-3">${s.solicitud_id}</td><td class="p-3">${s.nombre_usuario || 'Anónimo'}</td><td class="p-3">${s.id_tecnico || 'Sin asignar'}</td><td class="p-3 font-bold">${s.respuesta_solicitud.toUpperCase()}</td></tr>`).join('');

            // Gráfico 3: Incidencia
            const serviciosValidos = [
    "Fumigación contra El dengue y chikungunya",
    "Desbrozado de entrada, patios y Jardines",
    "Problemas de Plomería",
    "Fuga de Agua",
    "Tuberías trancadas del drenaje sanitario y de lluvias",
    "Mi Ducha Eléctrica NO funciona",
    "Interruptor / Tomacorriente NO funciona",
    "Requiero Solución definitiva para GOTERAS",
    "Mantenimiento de AIRE ACONDICIONADO",
    "Instalación de AIRE ACONDICIONADO",
    "Servicio control de Humedad en Paredes",
    "Retoques de pintura en Fachada, Puertas de Acceso, Etc.",
    "Fumigación contra plagas de jardines (Pulgón, mosca Blanca, Petillas, ácaros Etc.)",
    "Necesito aplicar veneno para los Sepes",
    "Remodelación de Vivienda y Oficinas",
    "Ampliación de Vivienda y Oficinas"
];

// Lógica de conteo actualizada
const conteo = {};
solicitudes.forEach(s => {
    // Si el comentario no está en la lista, se asigna como "Otros"
    const categoria = serviciosValidos.includes(s.comentario_solicitud) ? s.comentario_solicitud : "Otros";
    conteo[categoria] = (conteo[categoria] || 0) + 1;
});

const labels = Object.keys(conteo);
const data = Object.values(conteo).map(c => parseFloat(((c / solicitudes.length) * 100).toFixed(1)));
const maxVal = Math.max(...data);

if (chartIncidencia) chartIncidencia.destroy();
chartIncidencia = new Chart(document.getElementById('graficoServicios').getContext('2d'), { 
    type: 'bar', 
    plugins: [ChartDataLabels],
    data: { labels, datasets: [{ data, backgroundColor: data.map(v => getColor(Number(v), data)) }] }, 
    options: { 
        indexAxis: 'y', 
        responsive: true, 
        maintainAspectRatio: false,
        plugins: { 
            legend: { display: false }, 
            datalabels: { anchor: 'end', align: 'right', formatter: v => v + '%', padding: 5 } 
        },
        scales: { x: { max: maxVal + 15, beginAtZero: true } }
    } 
});
document.getElementById('tablaIncidencia').innerHTML = labels.map((l, i) => `<tr><td class="p-2">${l}</td><td class="p-2 text-right font-bold" style="color:${getColor(Number(data[i]), data)}">${data[i]}%</td></tr>`).join('');
            // Gráfico 4: Productividad
            const finalizados = solicitudes.filter(s => s.respuesta_solicitud === 'finalizado');
            const cTech = {};
            finalizados.forEach(s => cTech[s.id_tecnico || 'Sin asignar'] = (cTech[s.id_tecnico || 'Sin asignar'] || 0) + 1);
            const lTech = Object.keys(cTech);
            const dTech = Object.values(cTech).map(c => parseFloat(((c / finalizados.length) * 100).toFixed(1)));
            const maxTech = Math.max(...dTech);

            if (chartProductividad) chartProductividad.destroy();
            chartProductividad = new Chart(document.getElementById('graficoProductividad').getContext('2d'), { 
                type: 'bar', 
                plugins: [ChartDataLabels],
                data: { labels: lTech, datasets: [{ data: dTech, backgroundColor: dTech.map(v => getColor(Number(v), dTech)) }] }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, 
                        datalabels: { anchor: 'end', align: 'top', formatter: v => v + '%' } 
                    },
                    scales: { y: { max: maxTech + 15, beginAtZero: true } } 
                } 
            });
            document.getElementById('tablaProductividad').innerHTML = lTech.map((l, i) => `<tr><td class="p-2">${l}</td><td class="p-2 text-right font-bold" style="color:${getColor(Number(dTech[i]), dTech)}">${dTech[i]}%</td></tr>`).join('');
        }

        cargarTodo();
        client.channel('admin_channel').on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, cargarTodo).subscribe();
    </script>
</body>
</html>
