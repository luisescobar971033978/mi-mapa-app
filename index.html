<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-teal-900 mb-6 text-center">SOLICITAR SERVICIO</h2>
        
        <form id="solicitudForm" class="space-y-4">
            <input type="text" id="nombre" placeholder="Nombre del Usuario" class="w-full p-3 border rounded-lg" required>
            <input type="number" id="celular" placeholder="No. Celular Contacto" class="w-full p-3 border rounded-lg" required>
            
            <select id="opcion_servicio" class="w-full p-3 border rounded-lg" required onchange="verificarOtro()">
                <option value="">SELECCIONE EL PROBLEMA</option>
                <option value="Electricidad">Electricidad</option>
                <option value="Plomería">Plomería</option>
                <option value="Carpintería">Carpintería</option>
                <option value="Otro">Otro, describa su problema</option>
            </select>

            <div id="otroCampo" class="hidden">
                <textarea id="descripcion" placeholder="Por favor describa aquí su problema" class="w-full p-3 border rounded-lg"></textarea>
            </div>

            <button type="submit" class="w-full bg-teal-800 text-white p-4 rounded-xl font-bold">SOLICITAR SERVICIO</button>
        </form>

        <button type="button" onclick="toggleAyuda()" class="mt-6 w-full text-teal-800 underline font-semibold text-sm">
            ¿Necesitas ayuda?
        </button>
    </div>

    <div id="ayudaMensaje" onclick="toggleAyuda()" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm text-center">
            <h3 class="font-bold text-xl mb-2 text-teal-900">Ayuda</h3>
            <p class="text-gray-700">Por favor, rellena tus datos y selecciona el tipo de problema. Si no ves tu caso, elige "Otro" y descríbelo brevemente. Responderemos lo antes posible.</p>
            <p class="text-xs text-gray-400 mt-4 italic">(Toca cualquier parte de la pantalla para cerrar)</p>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
            
            const client = supabase.createClient(supabaseUrl, supabaseKey);

            window.toggleAyuda = function() {
                const mensaje = document.getElementById('ayudaMensaje');
                mensaje.classList.toggle('hidden');
            };

            window.verificarOtro = function() {
                const select = document.getElementById('opcion_servicio');
                const otro = document.getElementById('otroCampo');
                otro.classList.toggle('hidden', select.value !== 'Otro');
            };

            document.getElementById('solicitudForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const nombre = document.getElementById('nombre').value;
                const celular = document.getElementById('celular').value;
                const opcion = document.getElementById('opcion_servicio').value;
                const desc = document.getElementById('descripcion').value;
                const textoFinal = (opcion === 'Otro') ? desc : opcion;

                const { data, error } = await client
                    .from('solicitudes')
                    .insert([{ 
                        nombre_usuario: nombre, 
                        celular_contacto: celular, 
                        comentario_solicitud: textoFinal,
                        respuesta_solicitud: 'pendiente'
                    }])
                    .select(); // IMPORTANTE: .select() nos permite obtener el registro creado

                if (error) {
                    alert("Error: " + error.message);
                } else {
                    // Guardamos el ID de la solicitud para usarlo luego en mapa.html
                    if(data && data.length > 0) {
                        localStorage.setItem('id_solicitud', data[0].id);
                    }
                    
                    alert("¡Solicitud enviada con éxito! Por favor Marcar y CONFIRMAR UBICACION");
                    window.location.href = 'mapa.html'; // Redirección al mapa
                }
            });
        });
    </script>
</body>
</html>
