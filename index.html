<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // Configuración de Supabase
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co'; //
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg'; //
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    function verificarOtro() {
        const servicio = document.getElementById('servicio').value;
        const campoOtro = document.getElementById('otroCampo');
        campoOtro.classList.toggle('hidden', servicio !== 'Otro');
    }

    document.getElementById('solicitudForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nombre = document.getElementById('nombre').value;
        const celular = document.getElementById('celular').value;
        const servicio = document.getElementById('servicio').value;
        const descripcion = document.getElementById('descripcion').value;

        // Guardar en Supabase
        const { data, error } = await supabase
            .from('solicitudes')
            .insert([{ 
                nombre_usuario: nombre, 
                celular_contacto: celular, 
                servicio: servicio, 
                comentario_solicitud: (servicio === 'Otro' ? descripcion : servicio) 
            }])
            .select(); // Esto nos devuelve la fila creada, incluyendo el ID

        if (error) {
            alert("Error al guardar: " + error.message);
        } else {
            // Si todo sale bien, redirigimos al mapa pasando el ID recién creado
            const nuevoId = data[0].solicitud_id;
            window.location.href = `mapa.html?id=${nuevoId}`;
        }
    });
</script>
