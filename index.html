<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud de Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; opacity: 0.1; z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <img src="logo_1.jpeg" class="watermark" alt="Logo">
    
    <div class="max-w-md w-full bg-white/90 p-8 rounded-2xl shadow-xl z-10">
        <h2 class="text-2xl font-bold text-teal-900 mb-6 text-center">SOLICITAR SERVICIO</h2>
        
        <form id="solicitudForm" class="space-y-4">
            <input type="text" id="nombre" placeholder="Nombre del Usuario" class="w-full p-3 border rounded-lg" required>
            <input type="tel" id="celular" placeholder="No. Celular Contacto" class="w-full p-3 border rounded-lg" required>
            
            <select id="servicio" onchange="verificarOtro()" class="w-full p-3 border rounded-lg" required>
                <option value="">SELECCIONE EL PROBLEMA QUE UD TIENE</option>
                <option value="Electricidad">Electricidad</option>
                <option value="Plomería">Plomería</option>
                <option value="Carpintería">Carpintería</option>
                <option value="Otro">Otro, Describa su Problema</option>
            </select>

            <div id="otroCampo" class="hidden">
                <textarea id="descripcion" placeholder="Describa su requerimiento..." class="w-full p-3 border rounded-lg"></textarea>
            </div>

            <button type="submit" class="w-full bg-teal-800 text-white p-4 rounded-xl font-bold hover:bg-teal-900">SOLICITAR SERVICIO</button>
        </form>
    </div>
<script>
    // Configuración de Supabase
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const supabase = supabase.createClient(supabaseUrl, supabaseKey);

    function verificarOtro() {
        const servicio = document.getElementById('servicio').value;
        const campoOtro = document.getElementById('otroCampo');
        if(campoOtro) campoOtro.classList.toggle('hidden', servicio !== 'Otro');
    }

    document.getElementById('solicitudForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Obtener valores
        const nombre = document.getElementById('nombre').value;
        const celular = document.getElementById('celular').value;
        const servicio = document.getElementById('servicio').value;
        const descripcion = document.getElementById('descripcion')?.value || "";

        try {
            const { data, error } = await supabase
                .from('solicitudes')
                .insert([{ 
                    nombre_usuario: nombre, 
                    celular_contacto: celular, 
                    servicio: servicio, 
                    comentario_solicitud: (servicio === 'Otro' ? descripcion : servicio) 
                }])
                .select();

            if (error) throw error;

            // Redirigir si fue exitoso
            window.location.href = `mapa.html?id=${data[0].solicitud_id}`;
        } catch (err) {
            alert("Error al guardar: " + err.message);
        }
    });
</script>
</body>
</html>
