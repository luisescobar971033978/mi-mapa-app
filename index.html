<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitar Servicio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-teal-900 mb-6 text-center">SOLICITAR SERVICIO</h2>
        <form id="solicitudForm" class="space-y-4">
            <input type="text" id="nombre" placeholder="Nombre del Usuario" class="w-full p-3 border rounded-lg" required>
            <input type="number" id="celular" placeholder="No. Celular Contacto" class="w-full p-3 border rounded-lg" required>
            
            <select id="opcion_servicio" class="w-full p-3 border rounded-lg" required onchange="verificarOtro()">
                <option value="">SELECCIONE EL PROBLEMA</option>
                <option value="Electricidad">Electricidad</option>
                <option value="Plomería">Plomería</option>
                <option value="Carpintería">Carpintería</option>
                <option value="Otro">Otro, describa su problema</option>
            </select>

            <div id="otroCampo" class="hidden">
                <textarea id="descripcion" placeholder="Por favor describa aquí su problema" class="w-full p-3 border rounded-lg"></textarea>
            </div>

            <button type="submit" class="w-full bg-teal-800 text-white p-4 rounded-xl font-bold">SOLICITAR SERVICIO</button>
        </form>
    </div>

    <script>
        // Inicialización única (usando 'window' para evitar redeclaraciones)
        window.supabaseInstance = window.supabaseInstance || supabase.createClient(
            'https://kcxkadqhdojrnfepkgfk.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg'
        );

        function verificarOtro() {
            const select = document.getElementById('opcion_servicio');
            document.getElementById('otroCampo').classList.toggle('hidden', select.value !== 'Otro');
        }

        document.getElementById('solicitudForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const celular = document.getElementById('celular').value;
            const opcion = document.getElementById('opcion_servicio').value;
            const desc = document.getElementById('descripcion').value;
            const textoFinal = (opcion === 'Otro') ? desc : opcion;

            // Guardado en la base de datos
            const { data, error } = await window.supabaseInstance
                .from('solicitudes')
                .insert([{ 
                    nombre_usuario: nombre, 
                    celular_contacto: celular, 
                    comentario_solicitud: textoFinal,
                    respuesta_solicitud: 'pendiente'
                }]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("¡Solicitud enviada con éxito!");
                window.location.reload();
            }
        });
    </script>
</body>
</html>
