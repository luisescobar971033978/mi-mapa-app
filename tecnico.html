<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <div id="loginForm" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h3 class="font-bold text-teal-900 mb-4">IDENTIFICACIÓN DE TÉCNICO</h3>
            <input type="text" id="id_tecnico" placeholder="ID Técnico" class="w-full p-2 border rounded mb-2">
            <select id="select_movil" class="w-full p-2 border rounded mb-4">
                <option value="">Seleccione su Móvil</option>
                <option value="Movil_1">Móvil 1</option>
                <option value="Movil_2">Móvil 2</option>
                <option value="Movil_3">Móvil 3</option>
                <option value="Movil_4">Móvil 4</option>
                <option value="Movil_5">Móvil 5</option>
                
               </select>
            <button onclick="guardarSesion()" class="w-full bg-teal-900 text-white p-2 rounded font-bold">
        INICIAR TURNO
    </button>
            
        </div>

        <header class="mb-6 text-center" id="headerPrincipal">
    <h2 class="text-2xl font-bold text-teal-900">SOLICITUDES PENDIENTES</h2>
    <div class="flex justify-center items-center gap-2 mt-2">
        <p class="text-gray-500 text-sm">Técnico: <span id="displayTecnico" class="font-bold"></span></p>
        <button onclick="cargarSolicitudes()" class="text-teal-800 hover:text-teal-600 transition-transform hover:rotate-180">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
        </button>
    </div>
</header>

        <div id="listaSolicitudes" class="space-y-4">
            <div class="text-center py-10">Cargando datos...</div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        // Inicialización al cargar la página
        window.onload = () => {
            const t = localStorage.getItem('tecnico');
            if (!t) {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('headerPrincipal').classList.add('hidden');
            } else {
                document.getElementById('displayTecnico').innerText = t;
                cargarSolicitudes();
            }
        };

        function guardarSesion() {
    const idTecnico = document.getElementById('id_tecnico').value;
    const movil = document.getElementById('select_movil').value; // Toma el valor del select

    if (!idTecnico || !movil) {
        alert("Por favor, complete ambos campos.");
        return;
    }

    localStorage.setItem('tecnico', idTecnico);
    localStorage.setItem('movil', movil);
    location.reload(); // Recarga la página y oculta el formulario automáticamente
}

        async function cargarSolicitudes() {
            const { data, error } = await client.from('solicitudes').select('*')
                .eq('respuesta_solicitud', 'pendiente')
                .order('fecha_solicitud', { ascending: false });

            const lista = document.getElementById('listaSolicitudes');
            lista.style.opacity = "0.5";
            if (error) { lista.innerHTML = `<p class="text-red-500 text-center">Error al cargar.</p>`; return; }
            if (data.length === 0) { lista.innerHTML = `<p class="text-gray-500 text-center">No hay pendientes.</p>`; return; }
            lista.style.opacity = "1";

            lista.innerHTML = "";
            data.forEach(s => {
                lista.innerHTML += `
                <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-teal-800 mb-4">
                    <h3 class="font-bold text-lg">${s.comentario_solicitud || 'Sin comentario'}</h3>
                    <p class="text-sm text-gray-600"><strong>Cliente:</strong> ${s.nombre_usuario || 'Anónimo'}</p>
                    <div class="flex justify-between mt-2 text-xs text-gray-500">
                        <span>📅 ${s.fecha_solicitud}</span>
                        <span>🕒 ${s.hora_solicitud ? s.hora_solicitud.substring(0, 5) : 'N/A'}</span>
                    </div>
                    <button onclick="confirmar(${s.solicitud_id})" class="w-full mt-3 bg-teal-800 text-white p-2 rounded font-bold">CONFIRMAR SERVICIO</button>
                </div>`;
            });
        }

        async function confirmar(id) {
            // Seguridad: Doble verificación
            const { data: check } = await client.from('solicitudes').select('respuesta_solicitud').eq('solicitud_id', id).single();
            if (check?.respuesta_solicitud !== 'pendiente') { alert("Esta solicitud ya fue tomada."); location.reload(); return; }

            const horaActual = new Date().toLocaleTimeString('es-BO', { hour12: false });
            const { error } = await client.from('solicitudes').update({ 
                respuesta_solicitud: 'aceptado',
                hora_contacto: horaActual,
                id_tecnico: localStorage.getItem('tecnico'),
                movil_id: localStorage.getItem('movil')
            }).eq('solicitud_id', id);

            if (!error) { window.location.href = `mapa_tecnico.html?id=${id}`; }
            else { alert("Error al confirmar."); }
        }

        client.channel('solicitudes_channel').on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, () => { cargarSolicitudes(); }).subscribe();
    </script>
</body>
</html>
