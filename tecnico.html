<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <header class="mb-6">
            <h2 class="text-2xl font-bold text-teal-900 text-center">SOLICITUDES PENDIENTES</h2>
            <p class="text-center text-gray-500 text-sm">El sistema se actualizará solo al entrar nuevos pedidos.</p>
        </header>

        <div id="listaSolicitudes" class="space-y-4">
            <div class="text-center py-10">Cargando datos...</div>
        </div>
    </div>

   <script>
        const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
        const client = supabase.createClient(supabaseUrl, supabaseKey);

        async function cargarSolicitudes() {
            const { data, error } = await client
                .from('solicitudes')
                .select('*')
                .eq('respuesta_solicitud', 'pendiente')
                .order('fecha_solicitud', { ascending: false })
                .order('hora_solicitud', { ascending: false });

            const lista = document.getElementById('listaSolicitudes');
            
            if (error) {
                lista.innerHTML = `<p class="text-red-500 text-center">Error al cargar datos.</p>`;
                return;
            }

            if (data.length === 0) {
                lista.innerHTML = `<p class="text-gray-500 text-center">No hay solicitudes pendientes.</p>`;
                return;
            }

            lista.innerHTML = ""; // Limpiar antes de llenar
data.forEach(s => {
    const item = s || {}; // Protección extra
    const fecha = item.fecha_solicitud || 'Sin fecha';
    const hora = item.hora_solicitud ? item.hora_solicitud.substring(0, 5) : 'N/A';

    lista.innerHTML += `
    <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-teal-800 mb-4">
        <h3 class="font-bold text-lg">${item.comentario_solicitud || 'Sin comentario'}</h3>
        <p class="text-sm text-gray-600"><strong>Cliente:</strong> ${item.nombre_usuario || 'Anónimo'}</p>
        <div class="flex justify-between mt-2 text-xs text-gray-500">
            <span>📅 ${fecha}</span>
            <span>🕒 ${hora}</span>
        </div>
        <button onclick="confirmar(${item.solicitud_id})" 
                class="w-full mt-3 bg-teal-800 text-white p-2 rounded font-bold">
            CONFIRMAR SERVICIO
        </button>
    </div>
    `;
});
        }

        async function confirmar(id) {
            const btn = event.target;
            btn.innerText = "Procesando...";
            btn.disabled = true;

            const { error } = await client
                .from('solicitudes')
                .update({ respuesta_solicitud: 'aceptado' })
                .eq('solicitud_id', id);

            if (!error) {
                window.location.href = `mapa_tecnico.html?id=${id}`;
            } else {
                alert("Error al confirmar. Intente de nuevo.");
                btn.innerText = "CONFIRMAR SERVICIO";
                btn.disabled = false;
            }
        }

        // TIEMPO REAL: Una sola suscripción eficiente
        client.channel('solicitudes_channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, 
                () => { cargarSolicitudes(); })
            .subscribe();

        // Carga inicial
        cargarSolicitudes();
    </script>
</body>
</html>
