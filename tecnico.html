<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto">
        <div id="loginForm" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h3 class="font-bold text-teal-900 mb-4">IDENTIFICACIÓN DE TÉCNICO</h3>
            <input type="text" id="id_tecnico" placeholder="ID Técnico" class="w-full p-2 border rounded mb-2">
            <select id="select_movil" class="w-full p-2 border rounded mb-4">
                <option value="">Seleccione su Móvil</option>
                <option value="Movil_1">Móvil 1</option><option value="Movil_2">Móvil 2</option>
                <option value="Movil_3">Móvil 3</option><option value="Movil_4">Móvil 4</option>
                <option value="Movil_5">Móvil 5</option>
            </select>
            <button id="btnIniciar" onclick="guardarSesion()" class="w-full bg-teal-900 text-white p-2 rounded font-bold">INICIAR TURNO</button>
            <div id="loginMessage" class="mt-4 p-3 rounded-lg border border-red-400 bg-red-100 text-red-800 text-sm font-bold hidden text-center"></div>
        </div>

        <header class="mb-6 text-center hidden" id="headerPrincipal">
            <h2 class="text-2xl font-bold text-teal-900">SOLICITUDES PENDIENTES</h2>
            <div class="flex justify-center items-center gap-2 mt-2">
                <p class="text-gray-500 text-sm">Técnico: <span id="displayTecnico" class="font-bold"></span></p>
            </div>
            <button onclick="cerrarSesion()" class="mt-3 text-xs text-red-600 underline hover:text-red-800">Cerrar Sesión</button>
        </header>

        <div id="listaSolicitudes" class="space-y-4 hidden">
            <div class="text-center py-10">Cargando datos...</div>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    window.onload = () => {
        const t = localStorage.getItem('tecnico');
        if (!t) {
            document.getElementById('loginForm').classList.remove('hidden');
        } else {
            document.getElementById('displayTecnico').innerText = t;
            document.getElementById('headerPrincipal').classList.remove('hidden');
            const servicioPendiente = localStorage.getItem('solicitudId_activo');
            if (servicioPendiente) {
                window.location.href = `mapa_tecnico.html?id=${servicioPendiente}`;
            } else {
                cargarSolicitudes();
            }
        }
    };

    function cerrarSesion() {
        if(confirm("¿Deseas cerrar sesión?")) {
            localStorage.clear();
            location.reload();
        }
    }

    async function guardarSesion() {
        const idTecnico = document.getElementById('id_tecnico').value.trim();
        const movil = document.getElementById('select_movil').value;
        const msgDiv = document.getElementById('loginMessage');

        if (!idTecnico || !movil) {
            msgDiv.innerText = "⚠️ Complete todos los campos.";
            msgDiv.classList.remove('hidden');
            return;
        }

        try {
            const { data, error } = await client.from('moviles').select('*').eq('id_tecnico', idTecnico).eq('estado', 'activo').single();
            if (error || !data) {
                msgDiv.innerText = "❌ Acceso denegado.";
                msgDiv.classList.remove('hidden');
                return;
            }
            localStorage.setItem('tecnico', idTecnico);
            localStorage.setItem('movil', movil);
            location.reload();
        } catch (err) {
            console.error(err);
            alert("Error de conexión.");
        }
    }

    async function cargarSolicitudes() {
    const lista = document.getElementById('listaSolicitudes');
    
    // Cambiamos el ordenamiento a 'fecha_solicitud' que es la columna que sí tienes
    const { data, error } = await client
        .from('solicitudes')
        .select('*')
        .eq('respuesta_solicitud', 'pendiente')
        .order('solicitud_id', { ascending: false });
     
    if (error) { 
        console.error("Error Supabase:", error);
        // Mostramos el error real en la pantalla para confirmar que se arregló
        lista.innerHTML = `<p class="text-red-500 text-center">Error: ${error.message}</p>`; 
        return; 
    }
    
    if (data.length === 0) { 
        lista.innerHTML = `<p class="text-gray-500 text-center">No hay pendientes.</p>`; 
        return; 
    }
    
    lista.innerHTML = "";
    data.forEach(s => {
        lista.innerHTML += `
        <div class="bg-white p-4 rounded-lg shadow-md border-l-4 border-teal-800 mb-4">
            <h3 class="font-bold text-lg">${s.comentario_solicitud || 'Sin comentario'}</h3>
            <p class="text-sm text-gray-600"><strong>Cliente:</strong> ${s.nombre_usuario || 'Anónimo'}</p>
            <button onclick="confirmar(${s.solicitud_id})" class="w-full mt-3 bg-teal-800 text-white p-2 rounded font-bold">CONFIRMAR SERVICIO</button>
        </div>`;
    });
}

    async function confirmar(id) {
        localStorage.setItem('solicitudId_activo', id);
        try {
            const { error } = await client.from('solicitudes').update({ 
                respuesta_solicitud: 'aceptado',
                id_tecnico: localStorage.getItem('tecnico'),
                movil_id: localStorage.getItem('movil')
            }).eq('solicitud_id', id);

            if (error) throw error;

            await client.from('mensajes').insert({
                solicitud_id: id,
                emisor: 'tecnico',
                mensaje: 'Hola, soy su técnico. Voy en camino.'
            });

            window.location.href = `mapa_tecnico.html?id=${id}`;
        } catch (err) {
            alert("Error al confirmar el servicio.");
        }
    }

    // Canal en tiempo real
    client.channel('solicitudes_channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, () => { cargarSolicitudes(); })
        .subscribe();
    </script>
</body>
</html>
