<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Técnico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4">

    <div id="modalCustom" class="hidden fixed inset-0 bg-black bg-opacity-50 z-[2000] flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg w-80 text-center shadow-xl">
            <h3 id="modalTitle" class="font-bold text-lg mb-2 text-teal-900">Mensaje</h3>
            <p id="modalText" class="mb-6 text-sm text-gray-600"></p>
            <div id="modalButtons" class="flex gap-2 justify-center">
                <button id="btnConfirmar" class="bg-teal-800 text-white px-6 py-2 rounded font-bold">Aceptar</button>
                <button id="btnCancelar" class="hidden bg-gray-300 px-6 py-2 rounded font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <div id="loginForm" class="bg-white p-6 rounded-lg shadow-md mb-6 hidden">
            <h3 class="font-bold text-teal-900 mb-4">IDENTIFICACIÓN DE TÉCNICO</h3>
            <input type="text" id="id_tecnico" placeholder="ID Técnico" class="w-full p-2 border rounded mb-2">
            <select id="select_movil" class="w-full p-2 border rounded mb-4">
                <option value="">Seleccione su Móvil</option>
                <option value="Movil_1">Móvil 1</option><option value="Movil_2">Móvil 2</option>
                <option value="Movil_3">Móvil 3</option><option value="Movil_4">Móvil 4</option>
                <option value="Movil_5">Móvil 5</option>
            </select>
            <button onclick="guardarSesion()" class="w-full bg-teal-900 text-white p-2 rounded font-bold">INICIAR TURNO</button>
        </div>

        <header class="mb-6 text-center hidden" id="headerPrincipal">
            <h2 class="text-2xl font-bold text-teal-900">SOLICITUDES PENDIENTES</h2>
            <p class="text-gray-500 text-sm">Técnico: <span id="displayTecnico" class="font-bold"></span></p>
            <button onclick="preguntarCerrarSesion()" class="mt-2 text-xs text-red-600 underline">Cerrar Sesión</button>
        </header>

        <div id="listaSolicitudes" class="space-y-4">
            <div class="text-center py-10">Cargando servicios...</div>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://kcxkadqhdojrnfepkgfk.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg';
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    function mostrarModal(titulo, texto, onConfirm, showCancel = false) {
        const modal = document.getElementById('modalCustom');
        document.getElementById('modalTitle').innerText = titulo;
        document.getElementById('modalText').innerText = texto;
        const btnConf = document.getElementById('btnConfirmar');
        const btnCanc = document.getElementById('btnCancelar');
        btnConf.onclick = () => { modal.classList.add('hidden'); if(onConfirm) onConfirm(); };
        btnCanc.classList.toggle('hidden', !showCancel);
        btnCanc.onclick = () => modal.classList.add('hidden');
        modal.classList.remove('hidden');
    }

    async function cargarSolicitudes() {
        const lista = document.getElementById('listaSolicitudes');
        // Ordenamos por created_at descendente para que lo más nuevo salga primero
        const { data, error } = await client.from('solicitudes').select('*')
            .eq('respuesta_solicitud', 'pendiente')
            .order('created_at', { ascending: false });

        if (error) { lista.innerHTML = `<p class="text-red-500 text-center">Error al cargar.</p>`; return; }
        if (data.length === 0) { lista.innerHTML = `<p class="text-gray-500 text-center">No hay pendientes.</p>`; return; }
        
        lista.innerHTML = "";
        data.forEach(s => {
            lista.innerHTML += `
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-teal-800">
                <h3 class="font-bold text-lg">${s.comentario_solicitud || 'Sin descripción'}</h3>
                <p class="text-sm text-gray-600">Cliente: <strong>${s.nombre_usuario || 'Anónimo'}</strong></p>
                <button onclick="confirmar(${s.solicitud_id})" class="w-full mt-3 bg-teal-800 text-white p-2 rounded font-bold">CONFIRMAR SERVICIO</button>
            </div>`;
        });
    }

    async function confirmar(id) {
        try {
            const { error } = await client.from('solicitudes').update({ 
                respuesta_solicitud: 'aceptado',
                id_tecnico: localStorage.getItem('tecnico'),
                movil_id: localStorage.getItem('movil')
            }).eq('solicitud_id', id);

            if (error) throw error;

            await client.from('mensajes').insert({
                solicitud_id: id,
                emisor: 'tecnico',
                mensaje: 'Hola estimado, soy su técnico. Voy en camino.'
            });

            localStorage.setItem('solicitudId_activo', id);
            window.location.href = `mapa_tecnico.html?id=${id}`;
        } catch (err) {
            mostrarModal("Error", "No se pudo confirmar el servicio. Intente de nuevo.");
        }
    }

    function guardarSesion() {
        const idTecnico = document.getElementById('id_tecnico').value.trim();
        const movil = document.getElementById('select_movil').value;
        if (!idTecnico || !movil) { mostrarModal("Aviso", "Complete todos los campos."); return; }
        // Validación de técnico aquí...
        localStorage.setItem('tecnico', idTecnico);
        localStorage.setItem('movil', movil);
        location.reload();
    }

    function preguntarCerrarSesion() {
        mostrarModal("Cerrar Sesión", "¿Seguro que desea finalizar su turno?", () => {
            localStorage.clear();
            location.reload();
        }, true);
    }

    window.onload = () => {
        const t = localStorage.getItem('tecnico');
        if (!t) { document.getElementById('loginForm').classList.remove('hidden'); } 
        else {
            document.getElementById('displayTecnico').innerText = t;
            document.getElementById('headerPrincipal').classList.remove('hidden');
            const activo = localStorage.getItem('solicitudId_activo');
            if (activo) window.location.href = `mapa_tecnico.html?id=${activo}`;
            else cargarSolicitudes();
        }
    };

    client.channel('solicitudes_channel').on('postgres_changes', { event: '*', schema: 'public', table: 'solicitudes' }, () => { cargarSolicitudes(); }).subscribe();
    </script>
</body>
</html>
