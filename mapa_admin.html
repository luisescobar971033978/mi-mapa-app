<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Servicio en Curso</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        #mapa { z-index: 0; }
    </style>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Supervisión en Tiempo Real</h1>
        
        <div id="mapa" class="w-full h-96 bg-gray-200 rounded-lg shadow-md mb-6 flex items-center justify-center">
            <p class="text-gray-500">Cargando mapa y ubicación de la unidad...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-2">Detalles del Servicio</h2>
                <div id="infoServicio">Cargando datos del servicio...</div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-2">Chat de Comunicación</h2>
                <div id="chatMensajes" class="h-40 overflow-y-auto border-t pt-2 text-sm"></div>
            </div>
        </div>

        <div class="mt-6">
            <button onclick="manejarSalida()" class="w-full bg-red-600 text-white font-bold py-2 rounded shadow hover:bg-red-700 transition">
                Salir y Cerrar Servicio
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const solicitudId = urlParams.get('id');

        const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');

        let map, markerMovil, markerServicio;

        // --- FUNCIONES DE LÓGICA ---

        async function manejarSalida() {
            const { data: solicitud } = await client
                .from('solicitudes')
                .select('respuesta_solicitud')
                .eq('solicitud_id', solicitudId)
                .single();

            if (solicitud && solicitud.respuesta_solicitud === 'finalizado') {
                await client.from('mensajes').delete().eq('solicitud_id', solicitudId);
                await client.from('ubicacion_moviles').delete().eq('solicitud_id', solicitudId);
                console.log("Limpieza ejecutada.");
            }
            window.location.href = 'index.html'; 
        }

        async function inicializarMapa(latServicio, lngServicio) {
            const { data: posInicial } = await client
                .from('ubicacion_moviles')
                .select('latitud, longitud')
                .eq('solicitud_id', solicitudId)
                .single();

            const latM = posInicial ? posInicial.latitud : latServicio;
            const lngM = posInicial ? posInicial.longitud : lngServicio;

            map = L.map('mapa').fitBounds([[latServicio, lngServicio], [latM, lngM]], { padding: [50, 50] });
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            const iconoCasa = L.divIcon({ className: 'custom-icon', html: '<div style="font-size: 24px;">🏠</div>', iconSize: [30, 30] });
            markerServicio = L.marker([latServicio, lngServicio], { icon: iconoCasa }).addTo(map).bindPopup("Ubicación del Servicio");

            const iconoCamioneta = L.divIcon({ className: 'custom-icon', html: '<div style="font-size: 24px;">🚚</div>', iconSize: [30, 30] });
            markerMovil = L.marker([latM, lngM], { icon: iconoCamioneta }).addTo(map).bindPopup("Técnico en camino");
        }

        async function cargarDatosVisor() {
            if (!solicitudId) return;
            const { data: solicitud, error } = await client.from('solicitudes').select('*').eq('solicitud_id', solicitudId).single();
            if (error || !solicitud) return;

            document.getElementById('infoServicio').innerHTML = `
                <p><strong>ID Servicio:</strong> ${solicitud.solicitud_id}</p>
                <p><strong>Usuario:</strong> ${solicitud.nombre_usuario || 'Anónimo'}</p>
                <p><strong>Técnico Asignado:</strong> ${solicitud.id_tecnico || 'Sin asignar'}</p>
                <p><strong>Estado:</strong> ${solicitud.respuesta_solicitud || 'PENDIENTE'}</p>
                `;

            if (!map && solicitud.latitud) inicializarMapa(solicitud.latitud, solicitud.longitud);
            cargarMensajes(solicitudId);
        }

        async function cargarMensajes(id) {
            const { data: mensajes } = await client.from('mensajes').select('*').eq('solicitud_id', id).order('created_at', { ascending: true });
            const contenedor = document.getElementById('chatMensajes');
            contenedor.innerHTML = mensajes && mensajes.length > 0 
                ? mensajes.map(m => `<div class="mb-2 border-b">${m.emisor}: ${m.mensaje}</div>`).join('')
                : '<p>No hay mensajes.</p>';
        }

        window.onload = () => {
            cargarDatosVisor();
            // ... (Tus suscripciones de canal se mantienen iguales aquí abajo)
        };
    </script>
</body>
</html>
