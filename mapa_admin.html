<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visor de Servicio en Curso</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">

    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-4">Supervisión en Tiempo Real</h1>
        
        <div id="mapa" class="w-full h-96 bg-gray-200 rounded-lg shadow-md mb-6 flex items-center justify-center">
            <p class="text-gray-500">Cargando mapa y ubicación de la unidad...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-2">Detalles del Servicio</h2>
                <div id="infoServicio">Cargando datos del servicio...</div>
            </div>
            <div class="bg-white p-4 rounded shadow">
                <h2 class="font-bold mb-2">Chat de Comunicación</h2>
                <div id="chatMensajes" class="h-40 overflow-y-auto border-t pt-2 text-sm"></div>
            </div>
        </div>
    </div>

   <script>
    // 1. Obtener ID de la URL
    const urlParams = new URLSearchParams(window.location.search);
    const solicitudId = urlParams.get('id');

    // Cliente Supabase
    const client = supabase.createClient('https://kcxkadqhdojrnfepkgfk.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtjeGthZHFoZG9qcm5mZXBrZ2ZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwODkzOTEsImV4cCI6MjA5NTY2NTM5MX0._LyOVhG_bA26r7mO-xWmVfkXTARspop0Fp3trAhrcJg');

    // Función principal unificada
    async function cargarDatosVisor() {
        if (!solicitudId) {
            document.body.innerHTML = "<h1>Error: No se ha especificado un servicio.</h1>";
            return;
        }
        
        console.log("Cargando supervisor para la solicitud:", solicitudId);

        // 1. Obtener la solicitud
        const { data: solicitud, error } = await client
            .from('solicitudes')
            .select('*')
            .eq('solicitud_id', solicitudId)
            .single();

        if (error || !solicitud) {
            document.getElementById('infoServicio').innerText = "Error al cargar la información del servicio.";
            return;
        }

        // 2. Mostrar datos en modo solo lectura
        document.getElementById('infoServicio').innerHTML = `
            <p><strong>ID Servicio:</strong> ${solicitud.solicitud_id}</p>
            <p><strong>Usuario:</strong> ${solicitud.nombre_usuario || 'Anónimo'}</p>
            <p><strong>Técnico Asignado:</strong> ${solicitud.id_tecnico || 'Sin asignar'}</p>
            <p><strong>Estado:</strong> ${solicitud.respuesta_solicitud || 'PENDIENTE'}</p>
        `;

        // 3. Cargar mensajes
        cargarMensajes(solicitudId);
    }

    async function cargarMensajes(id) {
    const { data: mensajes, error } = await client
        .from('mensajes')
        .select('*')
        .eq('solicitud_id', id)
        .order('created_at', { ascending: true });

    if (error) {
        console.error("Error al cargar mensajes:", error);
        return;
    }

    const contenedor = document.getElementById('chatMensajes');
    
    if (mensajes && mensajes.length > 0) {
        contenedor.innerHTML = mensajes.map(m => `
            <div class="mb-2 p-2 bg-gray-50 rounded border-b">
                <span class="font-bold text-teal-700">${m.emisor || 'Usuario'}:</span> 
                <span class="text-gray-700">${m.mensaje}</span> 
            </div>
        `).join('');
    } else {
        contenedor.innerHTML = '<p class="text-gray-400 text-center italic">No hay mensajes aún.</p>';
    }
}

    // Inicialización y Suscripción en Tiempo Real
window.onload = () => {
    cargarDatosVisor();

    // 1. Suscripción para actualizaciones del servicio (estado, técnico, etc.)
    client.channel('realtime_visor_solicitud')
        .on('postgres_changes', { 
            event: 'UPDATE', 
            schema: 'public', 
            table: 'solicitudes', 
            filter: `solicitud_id=eq.${solicitudId}` 
        }, (payload) => {
            console.log("Servicio actualizado");
            cargarDatosVisor();
        })
        .subscribe();

    // 2. Suscripción para nuevos mensajes (¡INTEGRADA!)
    client.channel('realtime_visor_mensajes')
        .on('postgres_changes', { 
            event: 'INSERT', 
            schema: 'public', 
            table: 'mensajes', 
            filter: `solicitud_id=eq.${solicitudId}` 
        }, (payload) => {
            console.log("Nuevo mensaje recibido");
            cargarMensajes(solicitudId);
        })
        .subscribe();
};
</script>
</body>
</html>
